<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>coxanhduonghoctienghan</title>
<meta name="description" content="Học tiếng Hàn qua video YouTube, Facebook, TikTok: shadowing, từ vựng, ngữ pháp, flashcard, luyện nghe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f1f4fa; --surface-3:#e8edf6;
  --border:#e1e6ef; --text:#142033; --muted:#5b687d; --faint:#8a96a8;
  --primary:#2563eb; --primary-strong:#1d4ed8; --primary-soft:#e7eefe; --on-primary:#fff;
  --success:#15803d; --success-soft:#e5f6eb; --warn:#b45309; --warn-soft:#fff3dc;
  --danger:#c62828; --danger-soft:#fdeaea;
  --c-n:#2563eb; --c-v:#15803d; --c-a:#c2410c; --c-adv:#7c3aed; --c-p:#64748b; --c-x:#be185d; --c-u:#c62828;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
  --radius:14px; --radius-sm:10px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141f; --surface:#161e2c; --surface-2:#1c2637; --surface-3:#243046;
    --border:#2a3549; --text:#e7ecf4; --muted:#a0adc1; --faint:#77849a;
    --primary:#6b9bff; --primary-strong:#8db1ff; --primary-soft:#1d2b4a; --on-primary:#0b1220;
    --success:#4ade80; --success-soft:#14301f; --warn:#fbbf24; --warn-soft:#3a2c10;
    --danger:#f87171; --danger-soft:#3a1717;
    --c-n:#7aa7ff; --c-v:#4ade80; --c-a:#fb923c; --c-adv:#c4a1ff; --c-p:#94a3b8; --c-x:#f472b6; --c-u:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141f; --surface:#161e2c; --surface-2:#1c2637; --surface-3:#243046;
  --border:#2a3549; --text:#e7ecf4; --muted:#a0adc1; --faint:#77849a;
  --primary:#6b9bff; --primary-strong:#8db1ff; --primary-soft:#1d2b4a; --on-primary:#0b1220;
  --success:#4ade80; --success-soft:#14301f; --warn:#fbbf24; --warn-soft:#3a2c10;
  --danger:#f87171; --danger-soft:#3a1717;
  --c-n:#7aa7ff; --c-v:#4ade80; --c-a:#fb923c; --c-adv:#c4a1ff; --c-p:#94a3b8; --c-x:#f472b6; --c-u:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.ko{font-family:var(--font-ko)}
svg.i{width:18px;height:18px;flex:none;vertical-align:middle}
.hidden{display:none!important}

/* Top bar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:10px 20px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-family:var(--font-ko);font-weight:700;font-size:18px;flex:none}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav{display:flex;gap:4px;margin-left:auto}
.topnav button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.topnav button:hover{background:var(--surface-2);color:var(--text)}
.topnav button.active{background:var(--primary-soft);color:var(--primary)}
.topnav button:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{border:1px solid var(--border);background:var(--surface);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);background:var(--surface-2)}
.bottomnav{display:none}

main{max-width:1320px;margin:0 auto;padding:20px 20px 40px}
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Generic */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em}
h1{font-size:24px}
h2{font-size:18px}
h3{font-size:16px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;white-space:nowrap;transition:background .12s,border-color .12s,transform .05s;color:var(--text);text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-strong);border-color:var(--primary-strong)}
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.lg{padding:12px 18px;font-size:15px}
.btn.on{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 35%,transparent)}
.btn.rec{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
.input,.select,textarea.input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .12s,box-shadow .12s}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.input{resize:vertical;min-height:140px;font-family:var(--font-ko),var(--font);line-height:1.6}
label.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.hint{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.blue{background:var(--primary-soft);color:var(--primary)}
.badge.green{background:var(--success-soft);color:var(--success)}
.badge.orange{background:var(--warn-soft);color:var(--warn)}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--primary-soft);color:var(--primary)}
details.guide{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
details.guide summary{cursor:pointer;font-weight:600;font-size:14px}
details.guide ol{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
details.guide li{margin:4px 0}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;user-select:none}
.switch input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--surface-3);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{left:18px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font-size:36px;margin-bottom:6px}

/* Home */
.home-hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.prog-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;margin-bottom:20px}
.goal-card{display:flex;gap:20px;align-items:center}
.stats-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .num{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat .lab{font-size:13px;color:var(--muted)}
.stat.accent{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.stat.accent .lab{color:color-mix(in srgb,var(--on-primary) 80%,transparent)}
.src-detect{min-height:22px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.lesson-card{padding:16px;display:flex;flex-direction:column;gap:10px}
.lesson-card h3{font-size:15.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.progress{height:7px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.step b{color:var(--text)}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

/* Lesson */
.lesson-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lesson-head h1{font-size:19px;flex:1;min-width:160px;line-height:1.3}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.col-left{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
.player-wrap{background:#000;border-radius:var(--radius);overflow:hidden;position:relative;aspect-ratio:16/9;width:100%}
.player-wrap.tall{aspect-ratio:auto;height:min(68vh,620px);max-width:380px;margin:0 auto;background:#000}
.player-wrap.novideo{aspect-ratio:auto;background:var(--surface);border:1px dashed var(--border);min-height:120px}
.player-wrap iframe,.player-wrap video,.player-wrap>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-wrap video{background:#000}
.novideo-inner{position:static!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;color:var(--muted);height:auto!important}
.player-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;border-radius:var(--radius)}
.player-bar .sep{width:1px;height:24px;background:var(--border);margin:0 2px}
.player-bar .time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin-left:auto;padding-right:4px}
.shadow-card{padding:16px}
.shadow-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.shadow-ko{font-family:var(--font-ko);font-size:24px;font-weight:500;line-height:1.5;word-break:keep-all}
.shadow-ko .w{cursor:pointer;border-radius:6px;padding:0 2px;transition:background .1s}
.shadow-ko .w:hover{background:var(--primary-soft);color:var(--primary)}
.shadow-rom{color:var(--faint);font-size:14px;margin-top:2px}
.shadow-vi{margin-top:6px;font-size:15px;color:var(--muted)}
.shadow-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.shadow-actions .btn{flex:1 1 auto}
.rec-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.col-right{min-height:400px;display:flex;flex-direction:column}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button:hover{background:var(--surface-2);color:var(--text)}
.tabs button.active{background:var(--primary-soft);color:var(--primary)}
.tab-body{padding:14px;flex:1}
.script-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.sent-list{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 250px);overflow-y:auto;padding-right:4px;scroll-behavior:smooth}
.sent{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.sent:hover{background:var(--surface-2)}
.sent.active{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.sent .num{font-size:12px;color:var(--faint);font-weight:600;padding-top:4px;text-align:center}
.sent.done .num{color:var(--success)}
.sent .ko{font-size:17px;line-height:1.5}
.sent .vi{font-size:13.5px;color:var(--muted);margin-top:1px}
.sent .rom{font-size:12.5px;color:var(--faint)}
.sent .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sent .t{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{display:flex;flex-direction:column;align-items:center;padding:7px 10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;min-width:52px;transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--primary)}
.chip.sel{border-color:var(--primary);background:var(--primary-soft)}
.chip .s{font-family:var(--font-ko);font-size:18px;font-weight:500;line-height:1.3}
.chip .s .pt{color:var(--c-p);font-weight:400}
.chip .m{font-size:11.5px;color:var(--muted);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.n .s .b{color:var(--c-n)} .chip.v .s .b{color:var(--c-v)} .chip.a .s .b{color:var(--c-a)}
.chip.adv .s .b{color:var(--c-adv)} .chip.x .s .b{color:var(--c-x)} .chip.u .s .b{color:var(--c-u)}
.chip.u{border-style:dashed}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:currentColor;vertical-align:middle}
.lg-n{color:var(--c-n)} .lg-v{color:var(--c-v)} .lg-a{color:var(--c-a)} .lg-adv{color:var(--c-adv)} .lg-p{color:var(--c-p)} .lg-x{color:var(--c-x)}
.word-detail{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--surface-2);margin-bottom:14px}
.wd-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wd-word{font-family:var(--font-ko);font-size:26px;font-weight:700}
.wd-rows{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:10px;font-size:14px}
.wd-rows dt{color:var(--muted)}
.wd-rows dd{margin:0}
.gcard{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.gcard .pat{font-family:var(--font-ko);font-weight:700;color:var(--primary);font-size:16px}
.gcard .gname{font-weight:600}
.gcard .gexp{font-size:14px;color:var(--muted);margin-top:4px}
.gcard .gex{font-size:14px;margin-top:6px;padding-left:10px;border-left:3px solid var(--primary-soft)}
.gcard .from{font-size:12.5px;color:var(--faint);margin-top:4px}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin:16px 0 8px}
.ai-box{border:1px solid color-mix(in srgb,var(--c-adv) 35%,transparent);background:color-mix(in srgb,var(--c-adv) 7%,var(--surface));border-radius:12px;padding:14px;margin-top:8px}
.ai-box h4{display:flex;align-items:center;gap:6px;color:var(--c-adv);font-size:14px;margin-bottom:6px}
.ai-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.ai-table td{padding:6px 6px;border-top:1px solid var(--border);vertical-align:top}
.vlist{width:100%;border-collapse:collapse}
.vlist td{padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:14px}
.vlist .k{font-family:var(--font-ko);font-size:17px;font-weight:500;word-break:keep-all;min-width:72px;max-width:45%}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Listening */
.listen-box{text-align:center;padding:10px 4px}
.listen-q{font-family:var(--font-ko);font-size:22px;line-height:1.7;margin:14px 0;word-break:keep-all}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--primary);color:var(--primary);margin:0 3px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.choice{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;font-family:var(--font-ko);font-size:18px}
.choice:hover{border-color:var(--primary)}
.choice.right{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.choice.wrong{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.diff{font-family:var(--font-ko);font-size:20px;line-height:1.8;text-align:left;background:var(--surface-2);border-radius:10px;padding:10px 14px;margin-top:10px}
.diff .ok{color:var(--success)}
.diff .miss{color:var(--danger);background:var(--danger-soft);border-radius:4px}
.score-big{font-size:34px;font-weight:700}

/* Flashcards */
.fc-wrap{max-width:640px;margin:0 auto}
.flash{perspective:1400px;height:340px;cursor:pointer;margin:14px 0}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:8px;overflow:auto}
.face.back{transform:rotateY(180deg)}
.fc-main{font-family:var(--font-ko);font-size:40px;font-weight:700;line-height:1.25;word-break:keep-all}
.fc-main.vi{font-family:var(--font);font-size:26px}
.fc-sub{color:var(--muted);font-size:15px}
.fc-ex{font-size:14.5px;color:var(--muted);margin-top:8px;max-width:520px}
.fc-ex .ko{color:var(--text);font-size:16px}
.rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate-row .btn{flex-direction:column;gap:2px;padding:10px 6px}
.rate-row .btn small{font-weight:400;font-size:11.5px;color:var(--muted)}
.rate-row .r1{border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.rate-row .r2{border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn)}
.rate-row .r3{border-color:color-mix(in srgb,var(--success) 40%,transparent);color:var(--success)}
.rate-row .r4{border-color:color-mix(in srgb,var(--primary) 40%,transparent);color:var(--primary)}
.kbd{display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;color:var(--faint);margin-left:4px}

/* Progress */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;justify-content:start;gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--surface-3);display:block}
.heat i.l1{background:color-mix(in srgb,var(--primary) 30%,var(--surface-3))}
.heat i.l2{background:color-mix(in srgb,var(--primary) 55%,var(--surface-3))}
.heat i.l3{background:color-mix(in srgb,var(--primary) 80%,var(--surface-3))}
.heat i.l4{background:var(--primary)}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.levels{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-3)}
.levels span{display:block;height:100%}

/* Settings */
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{margin-bottom:14px}

/* Modal & toast */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--surface);border-radius:16px;width:100%;max-width:720px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-body{padding:16px 18px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:#1b2638;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s ease;text-align:center}
.toast.err{background:#a12424}
.toast.ok{background:#17673a}


/* ===== Trang chào mừng ===== */
body.is-landing .topbar, body.is-landing .bottomnav{display:none}
body.is-landing main{max-width:none;padding:0}
.flag{display:inline-block;width:28px;height:19px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08);flex:none;line-height:0}
.flag svg{width:100%;height:100%;display:block}
.land{--lb:#2563eb;--lb2:#60a5fa;--lg:#22c55e;--lp:#ec4899;min-height:100vh;background:var(--bg);padding:0 0 40px}
.land-head{display:flex;align-items:center;gap:18px;padding:16px clamp(16px,3vw,40px);max-width:1400px;margin:0 auto}
.land-brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex:none}
.land-brand .logo{width:42px;height:42px;font-size:22px;border-radius:13px;background:linear-gradient(135deg,var(--lb),var(--lb2));box-shadow:0 6px 16px color-mix(in srgb,var(--lb) 35%,transparent);color:#fff}
.land-brand-name{font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--text)}
.land-brand-name b{color:var(--lb)}
.land-nav{display:flex;gap:10px;margin:0 auto}
.land-nav button{display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-weight:500;font-size:15px;cursor:pointer;transition:all .15s;white-space:nowrap}
.land-nav button:hover{border-color:var(--lb);color:var(--lb);transform:translateY(-1px);box-shadow:0 6px 16px color-mix(in srgb,var(--lb) 15%,transparent)}
.land-nav button:first-child{background:linear-gradient(135deg,var(--lb),var(--lb2));border-color:transparent;color:#fff}
.land-right{display:flex;align-items:center;gap:10px;flex:none}
.lang-wrap{position:relative}
.lang-btn{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted)}
.lang-menu{position:absolute;right:0;top:calc(100% + 10px);background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 50px rgba(15,23,42,.18);padding:16px;width:340px;display:none;z-index:70}
.lang-menu.open{display:block;animation:fade .15s ease}
.lang-title{font-weight:700;margin-bottom:10px}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lang-grid button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;font-size:15px;color:var(--text);text-align:left}
.lang-grid button:hover,.lang-grid button.active{background:var(--surface-2)}
.lang-grid button.active{box-shadow:inset 0 0 0 1.5px var(--lb)}
.land-hero{position:relative;margin:8px clamp(12px,2.5vw,32px) 0;border-radius:40px;overflow:hidden;min-height:min(72vh,640px);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 12% 20%,color-mix(in srgb,var(--lb2) 30%,transparent),transparent 45%),radial-gradient(circle at 88% 80%,color-mix(in srgb,var(--lp) 20%,transparent),transparent 45%),radial-gradient(circle at 80% 15%,color-mix(in srgb,var(--lg) 18%,transparent),transparent 40%),linear-gradient(180deg,color-mix(in srgb,var(--lb) 9%,var(--surface)),var(--surface));
  border:1px solid color-mix(in srgb,var(--lb) 14%,var(--border))}
.land-hero .dots{position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--lb) 22%,transparent) 1.6px,transparent 1.7px);background-size:34px 34px;opacity:.6;pointer-events:none}
.land-copy{position:relative;text-align:center;padding:48px 20px;max-width:900px;z-index:2}
.land-copy h1{font-size:clamp(34px,5.6vw,68px);line-height:1.15;font-weight:800;letter-spacing:-.025em;color:var(--text)}
.land-copy h1 .hl{background:linear-gradient(90deg,var(--lb),var(--lb2) 55%,var(--lg));-webkit-background-clip:text;background-clip:text;color:transparent}
.land-copy p{font-size:clamp(15px,1.6vw,19px);color:var(--muted);max-width:720px;margin:22px auto 34px;line-height:1.6}
.land-cta{display:inline-flex;align-items:center;gap:18px;padding:12px 12px 12px 34px;border-radius:22px;border:0;cursor:pointer;color:#fff;font-weight:700;font-size:clamp(16px,1.6vw,20px);letter-spacing:.04em;
  background:linear-gradient(135deg,var(--lb),#3b82f6 55%,var(--lb2));box-shadow:0 14px 32px color-mix(in srgb,var(--lb) 40%,transparent);transition:transform .15s,box-shadow .15s}
.land-cta:hover{transform:translateY(-2px);box-shadow:0 18px 40px color-mix(in srgb,var(--lb) 50%,transparent)}
.cta-arrow{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--lb);display:grid;place-items:center}
.cta-arrow svg{width:22px;height:22px}
.bubble{position:absolute;padding:10px 18px;border-radius:16px;background:var(--surface);box-shadow:0 8px 24px rgba(15,23,42,.08);font-weight:600;font-size:16px;z-index:1;animation:floaty 5s ease-in-out infinite}
.bubble.b1{left:7%;top:16%;color:var(--lb)} .bubble.b2{left:18%;bottom:12%;color:var(--lg);animation-delay:-1s}
.bubble.b3{right:8%;top:20%;color:var(--lg);animation-delay:-2s} .bubble.b4{right:16%;bottom:16%;color:var(--lp);animation-delay:-3s}
.bubble.b5{right:30%;top:7%;color:var(--lp);font-size:14px;animation-delay:-4s}
@keyframes floaty{50%{transform:translateY(-10px)}}
.mascot{position:absolute;left:3%;bottom:-12px;width:clamp(120px,15vw,210px);z-index:1;animation:floaty 6s ease-in-out infinite}
.land-feats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1200px;margin:28px auto 0;padding:0 clamp(12px,2.5vw,32px)}
.feat{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:20px;border-radius:22px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text);transition:transform .15s,box-shadow .15s;font-size:14px}
.feat:hover{transform:translateY(-3px);box-shadow:0 12px 30px color-mix(in srgb,var(--c) 18%,transparent);border-color:color-mix(in srgb,var(--c) 40%,var(--border))}
.feat b{font-size:16px}
.feat>span:last-child{color:var(--muted)}
.feat-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);margin-bottom:4px}
.feat-ic svg{width:22px;height:22px}
@media (max-width:1100px){ .land-nav button span{display:none} .land-nav button{padding:12px} }
@media (max-width:820px){
  .land-head{flex-wrap:wrap;gap:12px}
  .land-nav{order:3;width:100%;margin:0;overflow-x:auto;scrollbar-width:none}
  .land-nav button span{display:inline} .land-nav button{padding:9px 14px;font-size:14px}
  .land-right{margin-left:auto}
  .land-brand{flex:1;min-width:0} .land-brand-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .land-copy h1{font-size:31px}
  .land-brand .logo{width:36px;height:36px;font-size:19px}
  .land-hero{border-radius:28px;min-height:auto}
  .land-copy{padding:56px 16px 120px}
  .bubble{font-size:13px;padding:7px 12px} .bubble.b2,.bubble.b5{display:none}
  .bubble.b1{top:3%;left:5%} .bubble.b3{top:4%;right:5%} .bubble.b4{bottom:4%;right:5%}
  .mascot{width:110px;left:2%}
  .land-feats{grid-template-columns:1fr 1fr;gap:10px}
  .lang-menu{width:min(320px,calc(100vw - 32px))}
}
@media (max-width:400px){ .land-brand-name{font-size:15px} }


/* ===== Khung ứng dụng: thanh bên + thanh trên ===== */
:root{--sbw:280px;--lb:#2563eb;--lb2:#60a5fa;--lg:#22c55e;--lp:#ec4899}
body.sb-collapsed{--sbw:84px}
body.is-landing .sidebar,body.is-landing .appbar,body.is-landing .drawer-bg{display:none}
body.is-landing .shell-main{margin-left:0}
.shell-main{margin-left:var(--sbw);min-width:0;transition:margin-left .2s}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sbw);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 14px;z-index:80;overflow-y:auto;overflow-x:hidden;transition:width .2s,transform .25s}
.sb-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
.sb-brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.sb-brand .logo{width:42px;height:42px;font-size:22px;border-radius:13px;background:linear-gradient(135deg,var(--lb),var(--lb2));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--lb) 30%,transparent)}
.sb-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-name b{color:var(--lb)}
.sb-collapse{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.sb-collapse:hover{color:var(--lb);border-color:var(--lb)}
.sb-streak{padding:12px 10px 14px;border-radius:16px;background:color-mix(in srgb,var(--lb) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--lb) 12%,var(--border));cursor:pointer;margin-bottom:16px}
.sb-label{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:10px}
.sb-fire{display:inline-flex;align-items:center;gap:3px;color:#f97316;font-weight:700}
.sb-fire svg{fill:#fb923c;stroke:#f97316}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.day svg{width:24px;height:24px;color:color-mix(in srgb,var(--lg) 65%,var(--border));stroke-width:1.8}
.day.on svg{fill:#facc15;color:#eab308}
.day.today span{color:var(--lb);font-weight:700}
.day.today svg{color:var(--lb)}
.day.today.on svg{color:#eab308}
.sb-nav{display:flex;flex-direction:column;gap:4px}
.sb-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:0;background:none;cursor:pointer;color:var(--text);font-size:15.5px;font-weight:500;text-align:left;position:relative;white-space:nowrap}
.sb-item svg.i{width:22px;height:22px;color:var(--muted)}
.sb-item:hover{background:var(--surface-2)}
.sb-item.active{background:color-mix(in srgb,var(--lb) 11%,var(--surface));color:var(--lb);font-weight:600}
.sb-item.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--lb)}
.sb-item.active svg.i{color:var(--lb)}
.sb-item.sub{font-size:14px;padding:9px 14px}
.sb-badge{margin-left:auto;font-style:normal;background:var(--lp);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
body.sb-collapsed .sb-name,body.sb-collapsed .sb-item span,body.sb-collapsed .sb-label,body.sb-collapsed .day span,body.sb-collapsed .sb-badge{display:none}
body.sb-collapsed .sb-top{flex-direction:column}
body.sb-collapsed .sb-item{justify-content:center;padding:12px}
body.sb-collapsed .week{grid-template-columns:1fr;gap:6px}
body.sb-collapsed .day svg{width:20px;height:20px}
body.sb-collapsed .sb-streak{padding:10px 4px}
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.menu-btn{display:none}
.gsearch{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0 14px;height:46px;width:min(420px,40vw);color:var(--muted);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.gsearch input{border:0;background:none;outline:none;flex:1;min-width:0;width:100%;font-size:15px}
.gsearch:focus-within{border-color:var(--lb);box-shadow:0 0 0 3px var(--primary-soft)}
.add-video{height:46px;padding:0 20px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--lb),var(--lb2));color:#fff;font-weight:600;font-size:15px;box-shadow:0 8px 20px color-mix(in srgb,var(--lb) 30%,transparent)}
.add-video:hover{background:linear-gradient(135deg,var(--primary-strong),var(--lb))}
.add-video svg.i{width:24px;height:24px}
.add-video svg rect{fill:#fff}.add-video svg polygon{fill:var(--lb)}
.appbar .icon-btn{width:46px;height:46px;border-radius:14px}
.fire-btn{display:flex!important;gap:2px;width:auto!important;padding:0 12px;color:var(--faint)}
.fire-btn b{font-size:14px}
.fire-btn.hot{color:#f97316}.fire-btn.hot svg{fill:#fb923c}
.appbar .lang-btn{height:46px;border-radius:14px;padding:0 12px}
.mascot-btn{width:50px;height:50px;border-radius:50%;border:2px solid color-mix(in srgb,var(--lb) 25%,var(--border));background:color-mix(in srgb,var(--lb) 8%,var(--surface));cursor:pointer;padding:2px;overflow:hidden;flex:none}
.mascot-btn .mascot{position:static;width:100%;height:100%;animation:none}
.drawer-bg{display:none}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
.page-head h1{font-size:26px}
.sec-title{font-size:21px}
.add-hero{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:center;padding:26px;border-radius:28px;background:linear-gradient(135deg,var(--lb) 0%,#3b82f6 45%,#38bdf8 100%);box-shadow:0 18px 40px color-mix(in srgb,var(--lb) 25%,transparent);position:relative;overflow:hidden}
.add-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--lp) 45%,transparent),transparent 70%);pointer-events:none}
.add-main{position:relative;z-index:1;min-width:0}
.add-main h2{color:#fff;font-size:clamp(19px,2.2vw,25px);font-weight:800;margin-bottom:16px}
.add-tabs{display:flex;gap:4px}
.add-tabs button{display:flex;align-items:center;gap:8px;padding:12px 20px;border:0;border-radius:16px 16px 0 0;background:color-mix(in srgb,#fff 25%,transparent);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.add-tabs button svg.i{width:22px;height:22px}
.add-tabs button.active{background:var(--surface);color:var(--lb)}
.add-box{background:var(--surface);border-radius:0 18px 18px 18px;padding:20px;position:relative;z-index:1}
.add-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-top:14px}
.add-go{height:46px;border-radius:14px;padding:0 22px}
.dropzone{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px;border:2px dashed color-mix(in srgb,var(--lb) 35%,var(--border));border-radius:16px;background:color-mix(in srgb,var(--lb) 4%,var(--surface));cursor:pointer;color:var(--text);font-size:15px}
.dropzone svg.i{width:30px;height:30px;color:var(--lb)}
.dropzone small{color:var(--muted)}
.dropzone:hover{border-color:var(--lb)}
.add-art{position:relative;height:250px;z-index:1}
.art-screen{position:absolute;left:10px;top:20px;width:200px;height:130px;border-radius:24px;background:color-mix(in srgb,#fff 92%,transparent);transform:rotate(-8deg);box-shadow:0 14px 30px rgba(15,23,42,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--lp);font-weight:700;font-size:18px}
.art-screen svg.i{width:64px;height:64px}
.add-art .mascot{position:absolute;right:0;bottom:0;width:170px;left:auto;animation:floaty 6s ease-in-out infinite}
.cat-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.cat-chip{--c:var(--lb);display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--c) 22%,transparent);background:color-mix(in srgb,var(--c) 8%,var(--surface));color:color-mix(in srgb,var(--c) 80%,var(--text));font-weight:500;font-size:14.5px;cursor:pointer;transition:all .12s}
.cat-chip:hover{border-color:var(--c);transform:translateY(-1px)}
.cat-chip.active{background:var(--c);border-color:var(--c);color:#fff}
.cat-chip.all{--c:#1e3a8a}
.cat-chip em{font-style:normal;font-size:12px;opacity:.75}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.vcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px color-mix(in srgb,var(--c) 15%,transparent)}
.vthumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface)),color-mix(in srgb,var(--c) 6%,var(--surface)));cursor:pointer;overflow:hidden}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb-ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--c)}
.vthumb-ph svg.i{width:46px;height:46px;opacity:.7}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--lb);display:grid;place-items:center;opacity:0;transition:all .15s}
.vcard:hover .vplay{opacity:1;transform:translate(-50%,-50%) scale(1)}
.vtag{position:absolute;left:10px;top:10px;background:var(--lp);color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.vcount{position:absolute;right:10px;bottom:10px;background:rgba(15,23,42,.72);color:#fff;font-size:12px;padding:2px 8px;border-radius:8px}
.vbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}

/* ===== Chế độ học: phát âm, luyện nghe, ôn tập, quiz ===== */
.mode-bar{display:flex;gap:8px;margin:-4px 0 14px;overflow-x:auto;scrollbar-width:none;padding:2px}
.mode-bar::-webkit-scrollbar{display:none}
.mode-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap;transition:all .12s}
.mode-btn:hover{border-color:var(--lb);color:var(--lb)}
.mode-btn.active{background:linear-gradient(135deg,var(--lb),var(--lb2));border-color:transparent;color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--lb) 30%,transparent)}
.mode-title{display:flex;align-items:center;gap:8px;font-weight:700;padding:8px 10px;color:var(--lb)}
.seg.wrap{flex-wrap:wrap}
.sring{--p:0;--c:var(--success);width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none;margin:0 auto}
.sring>div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.sring b{font-size:26px;color:var(--c)} .sring small{font-size:11.5px;color:var(--muted)}
.pron-card{text-align:center;padding:18px;border:1px solid var(--border);border-radius:18px;background:color-mix(in srgb,var(--lb) 3%,var(--surface))}
.pron-ko{font-size:26px;font-weight:600;line-height:1.5;word-break:keep-all}
.pron-rom{color:var(--faint);margin:4px 0 6px}
.pron-result,.trans-res{display:flex;gap:16px;align-items:flex-start;margin-top:14px;padding:16px;border-radius:16px;border:1px solid var(--border);text-align:left}
.pron-result .sring,.trans-res .sring{margin:0}
.tips{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.6}
.tips li{margin:3px 0}
.rv-word{font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.qz-q{font-size:17px;line-height:1.5;margin-bottom:12px}
.qz-opts{display:flex;flex-direction:column;gap:10px}
.qz-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;font-size:15px;color:var(--text)}
.qz-opt.ko{font-size:17px}
.qz-q.ko{font-family:var(--font-ko);font-size:19px;font-weight:600}
.qz-vi{color:var(--muted);margin:-6px 0 10px;font-size:14.5px}
.qz-ov{display:block;font-family:var(--font);font-size:13px;color:var(--muted);margin-top:2px}
.qz-refs{margin-top:10px;border:1px solid var(--border);border-radius:14px;padding:6px 10px}
.qz-ref{display:flex;gap:6px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--border)}
.qz-ref:first-child{border-top:0}
.qz-opt:hover:not(:disabled){border-color:var(--lb)}

.qz-opt.right{border-color:var(--success);background:var(--success-soft)} .qz-opt.right .qz-letter{background:var(--success);color:#fff}
.qz-opt.wrong{border-color:var(--danger);background:var(--danger-soft)} .qz-opt.wrong .qz-letter{background:var(--danger);color:#fff}

@media (max-width:720px){ .mode-btn{padding:8px 12px;font-size:13.5px} .pron-ko{font-size:21px} .rv-word{font-size:28px} .pron-result,.trans-res{flex-direction:column;align-items:center;text-align:center} }

.lesson-sum{display:flex;gap:10px;align-items:flex-start;margin:-6px 0 14px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--lb) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--lb) 15%,var(--border));font-size:14.5px;line-height:1.55;color:var(--text)}

/* ===== Luyện phát âm (kiểu ghi âm → AI chấm) ===== */
.pr-head{display:flex;align-items:center;justify-content:space-between;font-size:17px}
.pr-label{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);margin:2px 0 8px}
.pr-chips-row{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.pr-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 2px;scroll-behavior:smooth}
.pr-chips::-webkit-scrollbar{display:none}
.pr-chip{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);font-weight:600;cursor:pointer;color:var(--text);box-shadow:0 2px 0 var(--border)}
.pr-chip.good{border-color:color-mix(in srgb,var(--success) 60%,transparent);color:var(--success)}
.pr-chip.mid{border-color:color-mix(in srgb,var(--warn) 60%,transparent);color:var(--warn)}
.pr-chip.bad{border-color:color-mix(in srgb,var(--danger) 60%,transparent);color:var(--danger)}
.pr-chip.active{background:linear-gradient(135deg,var(--lb),var(--lb2));color:#fff;border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb,var(--lb) 60%,#000)}
.pr-nav{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.pr-nav:disabled{opacity:.4}
.pr-card{border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:16px}
.pr-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pr-tool{height:40px;min-width:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--text);font-weight:500;box-shadow:0 2px 0 var(--border)}
.pr-tool.on{background:color-mix(in srgb,var(--lb) 10%,var(--surface));border-color:color-mix(in srgb,var(--lb) 40%,transparent);color:var(--lb)}
.pr-ko{font-size:25px;font-weight:600;line-height:1.5;word-break:keep-all}
.pr-rom{color:var(--faint);margin-top:4px}
.pr-vi{color:var(--muted);margin-top:6px}
.pr-actions{display:flex;gap:10px;align-items:flex-start}
.pr-actions>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.pr-actions small{color:var(--faint);font-size:12px}
.pr-btn{height:54px;padding:0 18px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15.5px;cursor:pointer;color:var(--text);box-shadow:0 3px 0 var(--border);white-space:nowrap}
.pr-btn:disabled{opacity:.45}
.pr-main{width:100%;height:54px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--lb),#3b82f6 60%,var(--lb2));color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--lb) 60%,#000)}
.pr-main.rec{background:var(--danger);box-shadow:0 3px 0 #7f1d1d;animation:pulse 1.2s infinite}
.pr-main:disabled{opacity:.85;cursor:wait}
.pr-recnote{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:14px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite;flex:none}
.pr-score{margin-top:16px;padding:16px;border-radius:18px;background:var(--surface-2)}
.pr-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr-m{background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.pr-m span{color:var(--muted);font-size:14px}
.pr-m b{font-size:28px;letter-spacing:-.02em}
.pr-m.avg{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--lb) 25%,transparent)}
.pr-words{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pr-w{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pr-w .small{flex-basis:100%;color:var(--muted)}
@media (max-width:720px){ .pr-btn{padding:0 12px;font-size:14px} .pr-ko{font-size:21px} .pr-m b{font-size:24px} .pr-chip{width:40px;height:40px} }

/* Responsive */
@media (max-width:1080px){
  .topnav button span{display:none}
  .topnav button{padding:9px 11px}
}
@media (max-width:900px){
  .home-hero,.prog-hero{grid-template-columns:minmax(0,1fr)}
  .lesson-grid{grid-template-columns:minmax(0,1fr)}
  .col-left{position:static}
  .sent-list{max-height:none}
  .settings-grid{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
}
@media (max-width:720px){
  .topnav{display:none}
  .topbar{padding:10px 16px}
  .brand-name{font-size:14px}
  main{padding:14px 16px calc(84px + env(safe-area-inset-bottom))}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 2px;cursor:pointer;font-weight:500}
  .bottomnav button.active{color:var(--primary)}
  .bottomnav button:disabled{opacity:.35}
  .bottomnav svg.i{width:21px;height:21px}
  .shadow-ko{font-size:21px}
  .fc-main{font-size:32px}
  .flash{height:300px}
  .choices{grid-template-columns:1fr}
  .stat .num{font-size:22px}
  #toast{bottom:90px}
  h1{font-size:21px}
  .player-wrap.tall{height:62vh}
  .goal-card{flex-direction:column;align-items:flex-start}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal{padding:0;align-items:flex-end}
  .modal-box{max-height:94vh;border-radius:16px 16px 0 0}
}
@media (max-width:420px){
  .rate-row .btn small{display:none}
  .shadow-actions .btn span.lbl{display:none}
}

<script>
"use strict";
/* =========================================================
   BỘ PHÂN TÍCH TIẾNG HÀN (chạy offline)
   ========================================================= */
const HG = (() => {
  const BASE = 0xAC00;
  const T_OF = { "ㄱ":1, "ㄴ":4, "ㄹ":8, "ㅁ":16, "ㅂ":17, "ㅅ":19, "ㅆ":20, "ㅇ":21 };
  const dec = ch => { const c = ch.charCodeAt(0) - BASE; if (c < 0 || c > 11171) return null; return { L: Math.floor(c / 588), V: Math.floor((c % 588) / 28), T: c % 28 }; };
  const com = (L, V, T) => String.fromCharCode(BASE + L * 588 + V * 28 + T);
  const last = s => s ? dec(s[s.length - 1]) : null;
  const setLast = (s, f) => { const d = last(s); if (!d) return s; const n = f({ ...d }); return s.slice(0, -1) + com(n.L, n.V, n.T); };
  const hasB = s => { const d = last(s); return !!(d && d.T > 0); };
  const isHangul = s => /[가-힣]/.test(s);
  const attach = (base, rest) => {
    if (!rest) return base;
    const j = T_OF[rest[0]];
    if (j !== undefined) return setLast(base, d => { d.T = j; return d; }) + rest.slice(1);
    return base + rest;
  };
  return { dec, com, last, setLast, hasB, isHangul, attach, T_OF };
})();

const Morph = (() => {
  const { dec, com, last, setLast, attach } = HG;
  const bright = V => V === 0 || V === 8 || V === 2;

  function aForm(stem, irr) {
    const d = last(stem), pre = stem.slice(0, -1);
    if (!d) return stem + "어";
    if (d.L === 18 && d.V === 0 && d.T === 0) return pre + "해";
    const pd = pre ? last(pre) : null;
    if (irr === "R" && d.T === 0) {
      const b = pd ? bright(pd.V) : false;
      const p = pd ? setLast(pre, x => { x.T = 8; return x; }) : pre;
      return p + (b ? "라" : "러");
    }
    if (irr === "B" && d.T === 17) return pre + com(d.L, d.V, 0) + ((stem === "돕" || stem === "곱") ? "와" : "워");
    if (irr === "D" && d.T === 7) return pre + com(d.L, d.V, 8) + (bright(d.V) ? "아" : "어");
    if (irr === "S" && d.T === 19) return pre + com(d.L, d.V, 0) + (bright(d.V) ? "아" : "어");
    if (irr === "H" && d.T === 27) { let V = d.V; if (V === 0 || V === 4) V = 1; else if (V === 2 || V === 6) V = 3; return pre + com(d.L, V, 0); }
    if (d.T > 0) return stem + (bright(d.V) ? "아" : "어");
    switch (d.V) {
      case 0: case 1: case 3: case 4: case 5: case 6: case 7: return stem;
      case 8: return pre + com(d.L, 9, 0);
      case 13: return pre + com(d.L, 14, 0);
      case 20: return pre + com(d.L, 6, 0);
      case 11: return pre + com(d.L, 10, 0);
      case 18: { const b = pd ? bright(pd.V) : false; return pre + com(d.L, b ? 0 : 4, 0); }
      default: return stem + "어";
    }
  }
  function eu(stem, irr, rest) {
    const d = last(stem), pre = stem.slice(0, -1);
    if (irr === "B" && d.T === 17) return attach(pre + com(d.L, d.V, 0) + "우", rest);
    if (irr === "D" && d.T === 7) return attach(pre + com(d.L, d.V, 8) + "으", rest);
    if (irr === "S" && d.T === 19) return attach(pre + com(d.L, d.V, 0) + "으", rest);
    if (irr === "H" && d.T === 27) return attach(pre + com(d.L, d.V, 0), rest);
    if (d.T === 8) {
      const rd = dec(rest[0]);
      const drop = HG.T_OF[rest[0]] !== undefined || (rd && (rd.L === 2 || rd.L === 9));
      return drop ? attach(pre + com(d.L, d.V, 0), rest) : stem + rest;
    }
    if (d.T > 0) return attach(stem + "으", rest);
    return attach(stem, rest);
  }
  function sup(stem, rest) { // rest: ㅂ니다 / ㅂ니까
    const d = last(stem);
    if (d.T === 8) return attach(stem.slice(0, -1) + com(d.L, d.V, 0), rest);
    if (d.T > 0) return stem + "습" + rest.slice(1);
    return attach(stem, rest);
  }
  function plain(stem, rest) {
    const d = last(stem);
    if (d.T === 8) { const rd = dec(rest[0]); if (rd && rd.L === 2) return stem.slice(0, -1) + com(d.L, d.V, 0) + rest; }
    return stem + rest;
  }
  // [kiểu, đuôi, tags, áp dụng cho]   v = động từ, a = tính từ, vi = động từ + 있다/없다
  const ENDINGS = [
    ["A", "", ["aform"]], ["A", "요", ["haeyo"]], ["A", "서", ["aseo"]], ["A", "서요", ["aseo"]], ["A", "도", ["ado"]], ["A", "야", ["aya"]], ["A", "야지", ["aya"]],
    ["P", "어요", ["past", "haeyo"]], ["P", "어", ["past", "banmal"]], ["P", "습니다", ["past", "formal"]], ["P", "습니까", ["past", "formalq"]],
    ["P", "다", ["past", "dict"]], ["P", "고", ["past", "go"]], ["P", "지만", ["past", "jiman"]], ["P", "는데", ["past", "neunde"]], ["P", "는데요", ["past", "neunde"]],
    ["P", "네요", ["past", "neyo"]], ["P", "죠", ["past", "jiyo"]], ["P", "지요", ["past", "jiyo"]], ["P", "으면", ["past", "myeon"]], ["P", "으니까", ["past", "nikka"]],
    ["P", "을", ["past", "modfut"]], ["P", "거든요", ["past", "geodeunyo"]], ["P", "잖아요", ["past", "janayo"]], ["P", "겠어요", ["past", "gess"]], ["P", "어서", ["past", "aseo"]],
    ["P", "어도", ["past", "ado"]], ["P", "지", ["past", "ji"]], ["P", "던", ["past", "modpast"]],
    ["S", "ㅂ니다", ["formal"]], ["S", "ㅂ니까", ["formalq"]],
    ["E", "ㄴ", ["modpast"], "v"], ["E", "ㄴ", ["modadj"], "a"], ["E", "ㄹ", ["modfut"]], ["E", "면", ["myeon"]], ["E", "니까", ["nikka"]],
    ["E", "세요", ["seyo"]], ["E", "셔요", ["seyo"]], ["E", "셨어요", ["hon", "past"]], ["E", "셨습니다", ["hon", "past", "formal"]], ["E", "십니다", ["hon", "formal"]], ["E", "십니까", ["hon", "formalq"]],
    ["E", "시고", ["hon", "go"]], ["E", "시면", ["hon", "myeon"]], ["E", "시는", ["hon", "modpres"], "v"], ["E", "신", ["hon", "modpast"], "v"], ["E", "실", ["hon", "modfut"]], ["E", "시죠", ["hon", "jiyo"]], ["E", "셔서", ["hon", "aseo"]], ["E", "셔야", ["hon", "aya"]],
    ["E", "러", ["reo"], "v"], ["E", "려고", ["ryeogo"], "v"], ["E", "려고요", ["ryeogo"], "v"], ["E", "ㄹ게요", ["lgeyo"], "v"], ["E", "ㄹ게", ["lgeyo", "banmal"], "v"],
    ["E", "ㄹ까요", ["lkkayo"]], ["E", "ㄹ까", ["lkkayo", "banmal"]], ["E", "ㅂ시다", ["psida"], "v"], ["E", "ㄹ래요", ["lraeyo"], "v"], ["E", "ㄹ래", ["lraeyo", "banmal"], "v"],
    ["E", "ㄴ데", ["neunde"], "a"], ["E", "ㄴ데요", ["neunde"], "a"], ["E", "ㄴ가요", ["neunde"], "a"],
    ["D", "다", ["dict"]], ["D", "고", ["go"]], ["D", "지", ["ji"]], ["D", "지만", ["jiman"]], ["D", "지요", ["jiyo"]], ["D", "죠", ["jiyo"]],
    ["D", "네요", ["neyo"]], ["D", "네", ["neyo", "banmal"]], ["D", "는", ["modpres"], "vi"], ["D", "는데", ["neunde"], "vi"], ["D", "는데요", ["neunde"], "vi"], ["D", "나요", ["neunde"], "vi"],
    ["D", "기", ["gi"]], ["D", "게", ["ge"]], ["D", "겠어요", ["gess"]], ["D", "겠습니다", ["gess", "formal"]], ["D", "겠다", ["gess", "dict"]], ["D", "겠네요", ["gess", "neyo"]],
    ["D", "거든요", ["geodeunyo"]], ["D", "잖아요", ["janayo"]], ["D", "잖아", ["janayo", "banmal"]], ["D", "자", ["ja"], "v"], ["D", "는다", ["dict"], "v"],
  ];
  function conjugateAll(lemma, pos, irr) {
    const stem = lemma.slice(0, -1);
    const out = [];
    const itEop = /[있없]$/.test(stem);
    const isV = pos === "v";
    for (const [k, r, tags, only] of ENDINGS) {
      if (only === "v" && !isV) continue;
      if (only === "a" && (isV || itEop)) continue;
      if (only === "vi" && !(isV || itEop)) continue;
      let f;
      try {
        if (k === "A") f = aForm(stem, irr) + r;
        else if (k === "P") f = attach(aForm(stem, irr), "ㅆ") + r;
        else if (k === "S") f = sup(stem, r);
        else if (k === "E") f = eu(stem, irr, r);
        else if (k === "D") {
          if (r === "는다") { const d = last(stem); f = d.T === 0 ? attach(stem, "ㄴ다") : (d.T === 8 ? attach(stem.slice(0, -1) + com(d.L, d.V, 0), "ㄴ다") : stem + "는다"); }
          else f = plain(stem, r);
        }
      } catch (e) { continue; }
      if (f) out.push([f, tags]);
    }
    // ㅂ니다 dạng thay thế cho câu hỏi -아요?
    return out;
  }
  return { aForm, eu, sup, plain, conjugateAll };
})();

/* ---------- Xây dựng từ điển ---------- */

}

  if ((m = url.match(/instagram\.com\/(?:[\w.]+\/)?(?:p|reel|reels|tv)\/([\w-]+)/))) return { type: "instagram", id: m[1], label: "Instagram", tall: true };
  if (/\.(mp4|webm|ogg|m4v|mov|mp3|m4a|wav|aac)(\?|#|$)/i.test(url)) return { type: "direct", label: "File video/âm thanh trực tiếp" };
  if (/^https?:\/\//i.test(url)) return { type: "link", label: "Link khác (không nhúng được)" };
  return { type: "invalid", label: "Link chưa đúng" };
}

function go(hash) { if (location.hash === "#" + hash) route(); else location.hash = hash; }
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "welcome";
  const [v, id, tab] = h.split("/");
  if (cur.view === "lesson" && v !== "lesson") { PL && PL.pause && PL.pause(); stopRecIfAny(); }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  cur.view = v === "welcome" ? "welcome" : VIEWS.includes(v) ? v : "home";
  document.body.classList.remove("sb-open");
  document.body.classList.toggle("is-landing", cur.view === "welcome");
  $$(".view").forEach(s => s.classList.toggle("active", s.id === "view-" + cur.view));
  if (cur.view === "welcome") { renderLanding(); window.scrollTo(0, 0); return; }
  if (cur.view === "lesson") {
    const lid = id || DB.lastLesson;
    if (!lessonById(lid)) { location.replace("#videos"); return; }
    openLesson(lid, tab);
  } else if (cur.view === "home") renderHome();
  else if (cur.view === "videos") { $("#view-videos").dataset.ready = ""; renderVideos(); }
  else if (cur.view === "speak") { if (id) cur.speakMode = id; renderSpeak(); }
  else if (cur.view === "cards") renderCards();
  else if (cur.view === "progress") renderProgress();
  else if (cur.view === "settings") renderSettings();
  renderNav();
  window.scrollTo(0, 0);
}

function weekStars() {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const names = t("days").split(",");
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const x = DB.stats.days[dayKey(d)] || {};
    const on = (x.r || 0) + (x.s || 0) + (x.l || 0) + (x.w || 0) > 0;
    const today = d.getTime() === now.getTime();
    html += `<div class="day ${on ? "on" : ""} ${today ? "today" : ""}">${ic("star")}<span>${esc(names[i] || "")}</span></div>`;
  }
  return html;
}

/* ---------- Tự lấy tên video + phụ đề khi dán link ---------- */
async function fetchMeta(url, s) {
  const enc = encodeURIComponent;
  const canon = s.type === "youtube" ? "https://www.youtube.com/watch?v=" + s.id : url;
  const tries = [];
  if (s.type === "youtube") tries.push("https://www.youtube.com/oembed?format=json&url=" + enc(canon));
  if (s.type === "tiktok" || s.type === "tiktok-short") tries.push("https://www.tiktok.com/oembed?url=" + enc(url));
  tries.push("https://noembed.com/embed?url=" + enc(canon));
  for (const u of tries) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch(u, { signal: ctl.signal }); clearTimeout(t);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.error || !j.title) continue;
      const m = { title: String(j.title).replace(/\s+/g, " ").trim().slice(0, 140), author: j.author_name || "", thumb: j.thumbnail_url || "" };
      const vid = (j.html || "").match(/data-video-id="(\d+)"/) || (j.embed_product_id ? [0, j.embed_product_id] : null);
      if (s.type === "tiktok-short" && vid) m.src = { type: "tiktok", id: String(vid[1]), label: "TikTok", tall: true };
      return m;
    } catch (e) { }
  }
  if (s.type === "youtube") return { title: "", author: "", thumb: `https://i.ytimg.com/vi/${s.id}/hqdefault.jpg` };
  return null;
}

    if (job !== cur.form.job) return;

  } catch (e) {
    if (job !== cur.form.job) return;

    setAutoStatus(`<span style="color:var(--danger)">${esc(e.message)}</span><div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="auto-retry">${ic("repeat")} Thử lại</button><span class="small muted">hoặc chọn “Tự dán phụ đề” để dán tay.</span></div>`);
  }
  if (job === cur.form.job) setFormBusy(false);
}

const KIND_CLASS = { n: "n", pron: "n", num: "n", cnt: "n", det: "adv", v: "v", a: "a", adv: "adv", conj: "adv", int: "x", x: "x", u: "u" };
function chipHTML(t, i) {
  const cls = KIND_CLASS[t.pos] || "u";
  const s = t.parts.map(p => p.k === "p" ? `<span class="pt">${esc(p.t)}</span>` : `<span class="b">${esc(p.t)}</span>`).join("");
  const m = t.meaning ? t.meaning.split(/[;,(]/)[0].trim() : (t.guess ? "?" : "chưa có");
  return `<div class="chip ${cls} ${cur.word === i ? "sel" : ""}" data-act="pick-word" data-i="${i}"><span class="s">${s}</span><span class="m">${esc(m)}</span></div>`;
}
function structureText(t) {
  const out = [];
  const tags = describeTags(t);
  const pParts = t.parts.filter(p => p.k === "p");
  if ((t.pos === "v" || t.pos === "a") && t.base.endsWith("다")) {
    const endTags = tags.filter(x => !SUFFIX_NOTE[x.id] || x.id === "cop");
    if (endTags.length) out.push(`<span class="ko">${esc(t.base)}</span> → ${endTags.map(x => `<b class="ko">${esc(x.p)}</b> <span class="muted">(${esc(x.m)})</span>`).join(" + ")}`);
    else if (t.tags.includes("dict")) out.push(`Dạng nguyên mẫu <b class="ko">${esc(t.base)}</b>`);
  }
  for (const p of pParts) {
    const g = G[p.g]; if (!g) continue;
    out.push(`<b class="ko">${esc(p.t)}</b> = ${esc(g.n)} <span class="muted">(${esc(g.m)})</span>`);
  }
  if (!out.length && tags.length) out.push(tags.map(x => `<b class="ko">${esc(x.p)}</b> <span class="muted">(${esc(x.m)})</span>`).join(" + "));
  return out.join("<br>");
}

function lessonVocab(l) {
  const map = new Map();
  l.sentences.forEach((s, si) => analyze(s.ko).tokens.forEach(t => {
    if (!t.base || t.pos === "num") return;
    const k = t.base;
    if (!map.has(k)) map.set(k, { base: k, meaning: t.meaning, pos: t.pos, count: 0, si, surface: t.clean, guess: t.guess });
    map.get(k).count++;
  }));
  return [...map.values()];
}

/* ---------- Tab: ngữ pháp ---------- */
function renderGrammarTab(l, body) {
  const map = new Map();
  l.sentences.forEach(s => analyze(s.ko).grammar.forEach(g => {
    if (!map.has(g.id)) map.set(g.id, { id: g.id, snips: [], count: 0 });
    const x = map.get(g.id); x.count++; g.snips.forEach(sn => { if (!x.snips.includes(sn)) x.snips.push(sn); });
  }));
  const list = [...map.values()].sort((a, b) => b.count - a.count);
  const addable = list.filter(x => !DB.cards.some(c => c.type === "grammar" && c.front === G[x.id].p));
  body.innerHTML = `
    <div class="row between" style="margin-bottom:10px">
      <span class="muted small">${list.length} điểm ngữ pháp trong bài, sắp xếp theo số lần xuất hiện</span>
      <button class="btn sm primary" data-act="card-all-grammar" ${addable.length ? "" : "disabled"}>${ic("plus")} Thêm ${addable.length} vào flashcard</button>
    </div>
    ${list.length ? list.map(x => grammarCardHTML(x.id, x.snips, { lesson: true, count: x.count })).join("") : `<div class="empty">Chưa tìm thấy ngữ pháp.</div>`}`;
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function parseJSONLoose(txt) {
  txt = (txt || "").trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();

  if (txt.startsWith("[")) {
    let last = txt.lastIndexOf("}");
    while (last > 0) { try { const arr = JSON.parse(txt.slice(0, last + 1) + "]"); arr._partial = true; return arr; } catch (e) { last = txt.lastIndexOf("}", last - 1); } }
  }
  const a = txt.indexOf("["), o = txt.indexOf("{");
  const st = a >= 0 && (o < 0 || a < o) ? a : o;
  const en = Math.max(txt.lastIndexOf("]"), txt.lastIndexOf("}"));
  if (st >= 0 && en > st) return JSON.parse(txt.slice(st, en + 1));
  throw new Error("AI trả về dữ liệu không đọc được. Hãy thử lại.");

- Nếu lang = "ko": "ko" = chép CHÍNH XÁC câu tiếng Hàn nghe được, "vi" = dịch tiếng Việt tự nhiên.
- Nếu lang = "vi": "vi" = chép CHÍNH XÁC câu tiếng Việt nghe được, "ko" = câu tiếng Hàn tương ứng (nếu ngay trước/sau có câu tiếng Hàn cùng nghĩa thì dùng đúng câu đó, nếu không thì dịch sang tiếng Hàn tự nhiên).

/* AI chép lời thoại. Video dài được chia thành từng đoạn ~2 phút (có chồng lấn vài giây) để AI nghe kỹ từng đoạn:

    const fin = d => { if (done) return; done = true; URL.revokeObjectURL(u); res(d && isFinite(d) ? d : null); };

/* Lấy độ dài video YouTube bằng trình phát ẩn (không tốn lượt AI) */

    host.style.cssText = "position:fixed;left:-9999px;top:0;width:200px;height:120px"; const inner = document.createElement("div"); host.appendChild(inner); document.body.appendChild(host);
    const fin = d => { if (done) return; done = true; try { pl && pl.destroy(); } catch (e) { } host.remove(); res(d && isFinite(d) && d > 0 ? d : null); };

  }
  if (src && src.type === "youtube") return { fileData: { fileUri: "https://www.youtube.com/watch?v=" + src.id, mimeType: "video/*" } };

}

  const nw = DB.cards.filter(c => c.reps === 0 && deckFilter(c, deck)).sort((a, b) => a.created - b.created).slice(0, newAllowance());

});

function subTokens(s) { return analyze(s.ko).tokens; }
function renderSubBox() {
  const box = $("#subBox"); const l = curLesson(); if (!box || !l) return;
  const st = DB.settings;
  if (!l.sentences.length) { box.innerHTML = ""; box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  const s = l.sentences[cur.idx];
  if (cur.tab === "listen") { box.innerHTML = `<div class="sub-hide">${ic("ear")} Đang luyện nghe — phụ đề được ẩn</div>`; return; }
  if (cur.tab === "quiz" && cur.qz && cur.qz.items && cur.qz.i < cur.qz.items.length && cur.qz.picked == null) { box.innerHTML = `<div class="sub-hide">${ic("ear")} Đang làm quiz — nghe video để tìm đáp án, phụ đề hiện sau khi trả lời</div>`; return; }
  const toks = s.ko ? subTokens(s) : [];
  if (s.lang === "vi") {
    // Câu nói tiếng Việt: hiện câu Việt (đang nói) + câu Hàn tương ứng (bấm từng từ được)
    box.innerHTML = `<div class="sub-line sub-spoken-vi sz-${st.subSize}"><span class="lang-tag lt-vi">VI</span><span class="sv">${esc(s.vi)}</span></div>` +
      (toks.length ? `<div class="sub-line alt sz-${st.subSize}"><span class="lang-tag lt-ko">KO</span>${toks.map((t, i) => `<button class="sw k-${KIND_CLASS[t.pos] || "u"} ${cur.subWord === i ? "sel" : ""}" data-act="sub-word" data-i="${i}">${st.showRom ? `<span class="sr">${esc(Rom.text(t.clean))}</span>` : ""}<span class="sk">${esc(t.surface)}</span></button>`).join("")}</div>`
        : `<div class="sub-vi sz-${st.subSize}"><span class="faint" style="font-weight:400">Chưa có câu tiếng Hàn${st.aiKey ? ` · <a href="#" data-act="ai-translate-all">AI dịch</a>` : ""}</span></div>`);
    return;
  }
  const words = `<div class="sub-line sz-${st.subSize}">${l.bi ? `<span class="lang-tag lt-ko">KO</span>` : ""}${toks.map((t, i) => `<button class="sw k-${KIND_CLASS[t.pos] || "u"} ${cur.subWord === i ? "sel" : ""}" data-act="sub-word" data-i="${i}">${st.showRom ? `<span class="sr">${esc(Rom.text(t.clean))}</span>` : ""}<span class="sk">${esc(t.surface)}</span></button>`).join("")}</div>`;
  const vi = st.subVi || l.bi ? `<div class="sub-vi sz-${st.subSize}">${s.vi ? esc(s.vi) : `<span class="faint" style="font-weight:400">Chưa có bản dịch${st.aiKey ? ` · <a href="#" data-act="ai-explain">AI dịch</a>` : ""}</span>`}</div>` : "";
  box.innerHTML = words + vi;
}

/* ---------- Ô giải thích từ (bấm vào từ trong phụ đề) ---------- */
function curSubToken() { const l = curLesson(); if (!l || cur.subWord == null) return null; return subTokens(l.sentences[cur.idx])[cur.subWord] || null; }
function shortExplain(t) {
  const tags = describeTags(t);
  const parts = [];
  if (t.pos && t.pos !== "u") parts.push(`<b>${esc(POS_VI[t.pos] || t.pos)}</b>`);
  if (t.base !== t.clean && (t.pos === "v" || t.pos === "a")) parts.push(`dạng gốc <span class="ko">${esc(t.base)}</span>`);
  const g = tags.filter(x => x.id !== "dict").map(x => `<span class="ko">${esc(x.p)}</span> (${esc(x.m)})`);
  if (g.length) parts.push("gắn " + g.join(" + "));
  return parts.join(" · ");
}

const romCap = s => { const r = Rom.text(s); return r.charAt(0).toUpperCase() + r.slice(1); };

function placeWordPop(anchor) {
  const pop = $("#wordPop"), col = $(".col-left"); if (!pop || !col) return;
  if (innerWidth <= 720) { pop.style.left = pop.style.bottom = pop.style.top = ""; return; }
  const cr = col.getBoundingClientRect(), ar = anchor.getBoundingClientRect(), sb = $("#subBox").getBoundingClientRect();
  const w = Math.min(360, cr.width - 8);
  pop.style.width = w + "px";
  let left = ar.left - cr.left + ar.width / 2 - w / 2;
  left = Math.max(4, Math.min(cr.width - w - 4, left));
  pop.style.left = left + "px"; pop.style.top = "";
  pop.style.bottom = (cr.bottom - sb.top + 8) + "px";
  const ph = pop.offsetHeight, appbarH = ($("#appbar") ? $("#appbar").getBoundingClientRect().bottom : 70);
  if (sb.top - ph - 8 < appbarH) { pop.style.bottom = ""; pop.style.top = (sb.bottom - cr.top + 8) + "px"; }
}

function lessonExamples(t) {

/* ---------- Tab: QUIZ nội dung video (câu hỏi tiếng Hàn, giải thích tiếng Việt) ---------- */
const QUIZ_VER = 2;
function offlineQuiz(l) {
  const withVi = l.sentences.map((s, idx) => ({ s, idx })).filter(x => x.s.vi && x.s.ko.length > 3);
  if (withVi.length < 4) return [];
  return shuffle(withVi).slice(0, 8).map(({ s, idx }, k) => {
    const others = shuffle(withVi.filter(x => x.s !== s)).slice(0, 3).map(x => x.s);
    if (k % 2 === 0) {
      const opts = shuffle([s.vi, ...others.map(x => x.vi)]);
      return { q: `영상에서 "${s.ko}"는 무슨 뜻이에요?`, qVi: `Trong video, câu "${s.ko}" có nghĩa là gì?`, options: opts, optionsVi: null, answer: opts.indexOf(s.vi), explain: `«${s.ko}» nghĩa là: ${s.vi}`, ref: [idx], optVi: true };
    }
    const opts = shuffle([s.ko, ...others.map(x => x.ko)]);
    return { q: `"${s.vi}" — 이 뜻에 맞는 문장은 무엇이에요?`, qVi: `Câu nào có nghĩa: "${s.vi}"?`, options: opts, optionsVi: null, answer: opts.indexOf(s.ko), explain: `Câu đúng: «${s.ko}» — ${s.vi}`, ref: [idx] };
  });
}

}

  setIdx(r[0]);
  const s = l.sentences[r[0]];
  if (PL && PL.ctrl && s.start != null) { SEG.on = false; PL.pause(); PL.seek(Math.max(0, s.start - 0.05)); }
}
function playRange(l, a, b) {
  const sa = l.sentences[a], sb = l.sentences[b];
  if (PL && PL.ctrl && sa.start != null) {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    PL.setRate(cur.rate);
    Object.assign(SEG, { on: true, start: sa.start, end: sentenceEnd(l, b), loops: 0, after: null });
    PL.seek(Math.max(0, sa.start - 0.05)); PL.play();
  } else {
    let k = a; const next = () => { if (k > b) return; speak(l.sentences[k++].ko, { onend: () => setTimeout(next, 350) }); }; next();
  }
}
function renderQuizTab(l, body) {
  if (needSentences(l, body)) return;
  const valid = l.quiz && l.quiz.v === QUIZ_VER ? l.quiz : null;
  if (!cur.qz || cur.qz.lessonId !== l.id) cur.qz = { lessonId: l.id, i: 0, ok: 0, picked: null, items: valid ? valid.questions : null, jumped: -1 };
  const Q = cur.qz;
  const aiBtn = DB.settings.aiKey ? `<button class="btn soft sm" data-act="qz-ai" ${Q.busy ? "disabled" : ""}>${ic("spark")} ${valid ? "Tạo bộ câu hỏi mới bằng AI" : "Tạo quiz bằng AI"}</button>` : "";
  if (Q.busy) { body.innerHTML = `<div class="note info"><span class="spinner"></span> AI đang đọc nội dung video và soạn câu hỏi tiếng Hàn…${aiRetryNote ? `<br><span style="color:var(--warn)">${esc(aiRetryNote)}</span>` : ""}</div>`; return; }
  if (DB.settings.aiKey && !valid && !Q.triedAI) { Q.triedAI = true; ACT["qz-ai"](); return; }
  if (!Q.items) { Q.items = offlineQuiz(l); Q.offline = true; }
  if (!Q.items.length) { body.innerHTML = `<div class="empty"><div class="big">❓</div>Cần ít nhất 4 câu có bản dịch để tạo quiz.<br>${DB.settings.aiKey ? aiBtn : "Thêm mã AI trong Cài đặt để AI tạo quiz về nội dung video."}</div>`; return; }
  const top = `<div class="row between" style="margin-bottom:10px"><span class="muted small">${Q.offline ? "Quiz tạo từ lời thoại" : "Quiz do AI soạn theo nội dung video"}${l.quizBest != null ? ` · Điểm cao nhất: <b>${l.quizBest}%</b>` : ""}</span>${aiBtn}</div>`;
  if (Q.i >= Q.items.length) {
    const pct = Math.round(Q.ok / Q.items.length * 100); l.quizBest = Math.max(l.quizBest || 0, pct); save();
    body.innerHTML = top + `<div class="listen-box">${scoreRing(pct, "%")}<h2 style="margin-top:12px">Hoàn thành quiz!</h2><p class="muted">Đúng ${Q.ok}/${Q.items.length} câu</p><button class="btn primary" data-act="qz-restart">${ic("repeat")} Làm lại</button></div>`;
    renderSubBox(); return;
  }
  const it = Q.items[Q.i], ref = quizRef(l, it);
  if (Q.jumped !== Q.i) { Q.jumped = Q.i; Q.showVi = false; quizJump(l, it); }
  const refLabel = ref ? `câu ${ref[0] + 1}${ref[1] > ref[0] ? "–" + (ref[1] + 1) : ""}${l.sentences[ref[0]].start != null ? " · " + fmtTime(l.sentences[ref[0]].start) : ""}` : "";
  const answered = Q.picked != null;
  body.innerHTML = top + `
    <div class="row between"><span class="badge blue">Câu ${Q.i + 1}/${Q.items.length}</span><span class="muted small">Đúng ${Q.ok}</span></div>
    <div class="progress" style="margin:8px 0 14px"><span style="width:${Q.i / Q.items.length * 100}%"></span></div>
    <h3 class="qz-q ko">${esc(it.q)}</h3>
    ${Q.showVi && it.qVi ? `<div class="qz-vi">${esc(it.qVi)}</div>` : ""}
    <div class="row" style="gap:8px;margin:2px 0 12px">
      ${ref ? `<button class="btn sm primary" data-act="qz-listen">${ic("ear")} Nghe đoạn liên quan <span style="opacity:.8;font-weight:400">(${refLabel})</span></button>` : ""}
      ${it.qVi ? `<button class="btn sm ${Q.showVi ? "on" : ""}" data-act="qz-vi">${ic("translate")} ${Q.showVi ? "Ẩn nghĩa" : "Dịch"}</button>` : ""}
    </div>
    <div class="qz-opts">${it.options.map((o, k) => { let cls = ""; if (answered) { if (k === it.answer) cls = "right"; else if (k === Q.picked) cls = "wrong"; } const ov = Q.showVi && it.optionsVi && it.optionsVi[k]; return `<button class="qz-opt ${cls} ${it.optVi ? "" : "ko"}" data-act="qz-pick" data-k="${k}" ${answered ? "disabled" : ""}><span class="qz-letter">${"ABCD"[k]}</span><span>${esc(o)}${ov ? `<small class="qz-ov">${esc(ov)}</small>` : ""}</span></button>`; }).join("")}</div>
    ${answered ? `<div class="note ${Q.picked === it.answer ? "" : "warn"}" style="margin-top:12px">${Q.picked === it.answer ? "✓ Chính xác!" : "✕ Chưa đúng."} ${esc(it.explain || "")}</div>
      ${ref ? `<div class="qz-refs">${l.sentences.slice(ref[0], ref[1] + 1).map((s, k) => `<div class="qz-ref"><button class="btn ghost sm" data-act="qz-say" data-i="${ref[0] + k}" title="Nghe câu này">${ic("play")}</button><div><div class="ko">${esc(s.ko)}</div>${s.vi ? `<div class="small muted">${esc(s.vi)}</div>` : ""}</div></div>`).join("")}</div>` : ""}
      <div style="margin-top:12px;text-align:center"><button class="btn primary" data-act="qz-next">Câu tiếp ${ic("right")}</button></div>` : `<p class="hint" style="margin-top:10px">Phụ đề dưới video đang ẩn để bạn nghe và tự tìm đáp án — trả lời xong sẽ hiện lại.</p>`}`;
  renderSubBox();
}
ACT["qz-listen"] = () => { const l = curLesson(), r = quizRef(l, cur.qz.items[cur.qz.i]); if (r) playRange(l, r[0], r[1]); };
ACT["qz-say"] = el => { const i = +el.dataset.i; setIdx(i); playSentence(i, { loops: 0, keepIdx: true }); renderSubBox(); };
ACT["qz-vi"] = () => { cur.qz.showVi = !cur.qz.showVi; renderTab(); };
ACT["qz-pick"] = el => { const Q = cur.qz; Q.picked = +el.dataset.k; if (Q.picked === Q.items[Q.i].answer) Q.ok++; logAct("l"); renderTab(); };
ACT["qz-next"] = () => { const Q = cur.qz; Q.i++; Q.picked = null; renderTab(); };
ACT["qz-restart"] = () => { const Q = cur.qz; Q.i = 0; Q.ok = 0; Q.picked = null; Q.jumped = -1; if (Q.offline) Q.items = offlineQuiz(curLesson()); else Q.items = shuffle(Q.items); renderTab(); };
function transcriptText(l, max = 7000, numbered) { let t = ""; l.sentences.forEach((s, i) => { const line = (numbered ? `[${i}] ` : "") + s.ko + (s.vi ? " | " + s.vi : "") + "\n"; if (t.length + line.length <= max) t += line; }); return t; }
ACT["qz-ai"] = async () => {
  const l = curLesson(); const Q = cur.qz; Q.busy = true; renderTab();
  const tk = setInterval(() => { if (!Q.busy) return clearInterval(tk); if (cur.tab === "quiz") renderTab(); }, 1500);
  try {
    const r = await gemini([{ text: `Đây là lời thoại một video tiếng Hàn, mỗi dòng có số thứ tự [n] (kèm bản dịch nếu có). Tên video: «${l.title}».
${sumCtx(l) ? sumCtx(l) + "\n" : ""}${transcriptText(l, 7000, true)}
Hãy soạn 8 câu hỏi trắc nghiệm cho người Việt học tiếng Hàn sơ cấp (TOPIK 1-2): khoảng 5 câu hỏi về NỘI DUNG video (누가, 어디에서, 무엇을, 왜…) và 3 câu về từ vựng/ngữ pháp xuất hiện trong video.
YÊU CẦU BẮT BUỘC:
- "q" (câu hỏi) và "options" (4 lựa chọn) viết bằng TIẾNG HÀN đơn giản, câu ngắn, từ dễ, đuôi lịch sự -아요/어요.
- "qVi": dịch câu hỏi sang tiếng Việt; "optionsVi": dịch 4 lựa chọn sang tiếng Việt.
- "explain": giải thích bằng TIẾNG VIỆT vì sao đáp án đúng, có trích câu tiếng Hàn trong video.
- "ref": mảng số thứ tự [n] của 1-3 câu thoại liên tiếp chứa thông tin để trả lời.
- Chỉ 1 đáp án đúng, "answer" là chỉ số 0-3, vị trí đáp án đúng ngẫu nhiên.
Trả về JSON: {"questions":[{"q":"","qVi":"","options":["","","",""],"optionsVi":["","","",""],"answer":0,"explain":"","ref":[0]}]}` }]);
    const qs = (r.questions || r).filter(q => q && q.q && Array.isArray(q.options) && q.options.length >= 2).map(q => ({ q: String(q.q), qVi: q.qVi || "", options: q.options.slice(0, 4).map(String), optionsVi: Array.isArray(q.optionsVi) ? q.optionsVi.slice(0, 4).map(String) : null, answer: Math.max(0, Math.min(3, +q.answer || 0)), explain: q.explain || "", ref: Array.isArray(q.ref) ? q.ref : (q.ref != null ? [q.ref] : []) }));
    if (!qs.length) throw new Error("AI chưa tạo được câu hỏi, thử lại nhé.");
    l.quiz = { v: QUIZ_VER, questions: qs, created: Date.now() }; save();
    Object.assign(Q, { items: qs, offline: false, i: 0, ok: 0, picked: null, jumped: -1 });
  } catch (e) { toast(e.message, "err"); if (!Q.items) { Q.items = offlineQuiz(l); Q.offline = true; } }
  Q.busy = false; clearInterval(tk); renderTab();
};
