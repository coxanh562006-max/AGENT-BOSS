<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trang học tiếng Hàn</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#14213d;--muted:#5b6b82;--blue:#2563eb;--border:#dde5f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
.wrap{width:100%;max-width:560px}
h1{font-size:22px;margin:0 0 6px;text-align:center}
p{color:var(--muted);text-align:center;margin:0 0 20px}
a.card{display:block;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 4px 14px rgba(15,23,42,.06)}
a.card:hover{border-color:var(--blue)}
a.card b{display:block;font-size:18px;color:var(--blue);margin-bottom:4px}
a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Trang học tiếng Hàn</h1>
  <p>Chọn trang bạn muốn mở</p>
  <a class="card" href="coxanhduonghoctienghan.html"><b>coxanhduonghoctienghan</b><span>Học tiếng Hàn qua video: shadowing, phát âm, luyện nghe, phiên dịch, quiz</span></a>

</div>

</html>
