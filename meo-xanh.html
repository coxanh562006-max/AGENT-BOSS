<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7fb6e3">
<title>Mèo xanh – Học tiếng Hàn</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#f5f9fd; --card:#ffffff; --soft:#eef6fc;
    --blue:#a9d3f2; --blue-d:#5b9fd6; --blue-ink:#2f6ea8;
    --ink:#2b3d4f; --muted:#7a8ea1; --line:#e1ecf5;
    --ok:#4f9e7a; --ok-bg:#e8f5ee; --bad:#c9646c; --bad-bg:#fbeaec;
    --pink-bg:#fdf1f5;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;min-height:44px;background:var(--blue-d);color:#fff;touch-action:manipulation}
  button.ghost{background:var(--card);color:var(--blue-ink);border:1px solid var(--line)}
  button.soft{background:var(--soft);color:var(--blue-ink)}
  button.icon{background:transparent;color:var(--muted);min-height:36px;min-width:36px;padding:4px 8px;border-radius:10px}
  button.icon:hover{background:var(--soft)}
  button.chip{background:var(--card);color:var(--blue-ink);border:1px solid var(--line);min-height:36px;padding:6px 12px;border-radius:999px;font-size:14px}
  button.chip.on{background:var(--blue);color:#1d4c74;border-color:var(--blue)}
  button.tog{background:var(--soft);color:var(--blue-ink);min-height:36px;min-width:36px;padding:0;border-radius:50%}
  button.tog.on{background:var(--ok-bg);color:var(--ok)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;background:var(--card);color:var(--ink);width:100%}
  textarea{resize:vertical}
  label{display:grid;gap:4px;font-size:14px;color:var(--muted);margin-bottom:10px}
  .hidden{display:none!important}

  header.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
  .bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--blue-ink);white-space:nowrap}
  .logo{width:48px;height:38px;flex:none}
  nav.menu{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav.menu::-webkit-scrollbar{display:none}
  nav.menu button{background:transparent;color:var(--muted);padding:8px 12px;min-height:40px;white-space:nowrap;font-size:15px}
  nav.menu button:hover{background:var(--soft)}
  nav.menu button.on{background:var(--blue);color:#1d4c74}

  main{max-width:1040px;margin:auto;padding:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  h2{margin:0 0 12px;font-size:18px;font-weight:700}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .between{justify-content:space-between}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .meta{color:var(--muted);font-size:14px}
  .hint{color:var(--muted);font-size:13px;margin:6px 0 0}
  .empty{text-align:center;color:var(--muted)}
  .badge{font-size:12px;background:var(--soft);color:var(--blue-ink);padding:2px 10px;border-radius:999px;white-space:nowrap}
  .ko{font-weight:700;font-size:18px}

  /* Thư viện: cột thư mục bên trái */
  .lib{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
  .side{position:sticky;top:76px;padding:12px}
  .side h3{margin:4px 8px 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  .fitem{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;color:var(--ink);text-align:left;padding:9px 10px;margin-bottom:2px;font-size:15px;border-radius:10px}
  .fitem span{color:var(--muted);font-size:13px}
  .fitem:hover{background:var(--soft)}
  .fitem.on{background:var(--blue);color:#1d4c74}
  .fitem.on span{color:#1d4c74}
  .drop{border:2px dashed var(--blue);border-radius:16px;padding:20px 16px;text-align:center;background:var(--soft);transition:background .2s}
  .drop.over{background:#dcedfb;border-color:var(--blue-d)}
  .lesson{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
  .lesson:last-child{border-bottom:0}
  .track{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
  .fill{height:100%;background:var(--blue-d);border-radius:6px}
  .pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap}

  table.words{width:100%;border-collapse:collapse}
  table.words th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
  table.words td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.acts{white-space:nowrap;text-align:right}
  .addrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}

  /* Thẻ học */
  .flash{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,var(--card),var(--soft));box-shadow:0 8px 24px rgba(91,159,214,.10)}
  .flash .ko{font-size:clamp(34px,10vw,56px)}
  .flash .vi{font-size:clamp(20px,5.5vw,28px);color:var(--blue-ink);font-weight:700}
  .actions{justify-content:space-between;margin-top:14px}

  /* Trắc nghiệm */
  .opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;font-size:16px}
  .opt.right{background:var(--ok-bg);border-color:var(--ok)}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad)}

  /* Hội thoại */
  .chat{min-height:200px;max-height:50vh;overflow-y:auto;display:grid;gap:10px;padding:4px;margin-bottom:12px}
  .bubble{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;font-size:16px}
  .bubble.me{justify-self:end;background:var(--blue);color:#1d4c74;border-bottom-right-radius:4px}
  .bubble.ai{justify-self:start;background:var(--soft);border-bottom-left-radius:4px}
  .pdf{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px}

  /* Sổ tay */
  .note{padding:12px 0;border-bottom:1px solid var(--line)}
  .note:last-child{border-bottom:0}

  dialog{border:0;border-radius:18px;padding:0;max-width:440px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.2)}
  dialog::backdrop{background:rgba(43,61,79,.35)}
  .dlgbox{padding:20px}
  .dlgbox .actions{margin-top:6px}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;z-index:30}
  #toast.show{opacity:1;transform:translateX(-50%)}

  @media (max-width:820px){
    .lib{grid-template-columns:1fr}
    .side{position:static;display:flex;gap:6px;overflow-x:auto;padding:8px;scrollbar-width:none}
    .side h3{display:none}
    .fitem{width:auto;flex:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--card)}
    .fitem.on{border-color:var(--blue)}
  }
  @media (max-width:600px){
    .bar{flex-wrap:wrap;padding:10px 12px;gap:8px}
    nav.menu{width:100%;margin-left:0}
    nav.menu button{flex:none;padding:8px 10px;font-size:14px}
    main{padding:12px}
    .panel{padding:14px;border-radius:14px}
    .addrow{grid-template-columns:1fr}
    .actions button{flex:1 1 calc(50% - 8px)}
    .actions button.ghost{flex-basis:100%}
    table.words .hide-sm{display:none}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <symbol id="cat" viewBox="0 0 120 100">
    <circle cx="22" cy="18" r="7" fill="none" stroke="#f7b8c8" stroke-width="2"/>
    <circle cx="82" cy="20" r="3" fill="none" stroke="#a9d4f0" stroke-width="1.5"/>
    <circle cx="100" cy="58" r="5" fill="none" stroke="#f7d6b0" stroke-width="1.5"/>
    <path d="M30 60 C26 38 42 30 58 32 C80 34 92 46 90 62 C88 74 78 76 66 74 L60 82 C58 86 50 84 52 78 C42 80 32 72 30 60 Z" fill="#ffffff" stroke="#7a1f3a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M36 40 L40 26 L50 36 Z" fill="#bcdcf5" stroke="#7a1f3a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M60 36 L68 26 L72 40 Z" fill="#bcdcf5" stroke="#7a1f3a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M46 52 Q50 55 54 52" fill="none" stroke="#7a1f3a" stroke-width="2" stroke-linecap="round"/>
    <path d="M60 52 Q64 55 68 52" fill="none" stroke="#7a1f3a" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="42" cy="58" rx="4" ry="2.5" fill="#f7b8c8" opacity="0.7"/>
    <ellipse cx="72" cy="58" rx="4" ry="2.5" fill="#f7b8c8" opacity="0.7"/>
    <path d="M68 72 C74 80 66 92 58 90 C52 88 60 80 68 72 Z" fill="#bcdcf5" opacity="0.8"/>
  </symbol>
</svg>

<header class="top">
  <div class="bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 120 100" aria-hidden="true"><use href="#cat"/></svg>
      Mèo xanh
    </div>
    <nav class="menu" id="menu">
      <button data-go="library">Thư viện</button>
      <button data-go="flash">Thẻ học</button>
      <button data-go="quiz">Trắc nghiệm</button>
      <button data-go="sent">Đặt câu</button>
      <button data-go="tr">Dịch</button>
      <button data-go="talk">Hội thoại AI</button>
      <button data-go="grammar">Bài giảng</button>
      <button data-go="notes">Sổ tay</button>
    </nav>
  </div>
</header>

<main>
  <!-- THƯ VIỆN -->
  <section id="v-library" class="view">
    <div class="lib">
      <aside class="panel side">
        <h3>Thư mục</h3>
        <div id="sideFolders"></div>
      </aside>
      <div>
        <div class="panel">
          <h2>Tải file lên</h2>
          <div class="drop" id="drop">
            Kéo file vào đây hoặc bấm <b>Chọn file</b>
            <div class="hint">Hỗ trợ: .txt · .docx · .xlsx / .xls · .csv · .pdf · .pptx<br>Mỗi dòng là <b>từ tiếng Hàn – nghĩa</b> (Excel: 2 cột là đủ)</div>
          </div>
          <div class="row" style="margin-top:12px">
            <input id="folderName" list="folderOpts" placeholder="Tên thư mục, ví dụ: Bài 1" style="flex:1;min-width:180px">
            <datalist id="folderOpts"></datalist>
            <select id="uploadType" style="flex:1;min-width:180px" aria-label="Loại học">
              <option value="vocab">Từ vựng</option>
              <option value="ko-vi">Dịch Hàn → Việt</option>
              <option value="vi-ko">Dịch Việt → Hàn</option>
              <option value="grammar">Ngữ pháp / bài giảng</option>
              <option value="talk">Giao tiếp AI</option>
            </select>
            <button data-act="pickFile">Chọn file</button>
          </div>
          <p id="uploadMsg" class="hint"></p>
        </div>

        <div class="panel">
          <div class="row between"><h2 style="margin:0">Bài học</h2><span class="meta" id="libStats"></span></div>
          <div id="libList"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="v-words" class="view hidden"></section>
  <section id="v-flash" class="view hidden"></section>
  <section id="v-quiz" class="view hidden"></section>
  <section id="v-sent" class="view hidden"></section>
  <section id="v-tr" class="view hidden"></section>
  <section id="v-talk" class="view hidden"></section>
  <section id="v-grammar" class="view hidden"></section>
  <section id="v-notes" class="view hidden"></section>
</main>

<input type="file" id="fileInput" multiple style="display:none"
  accept=".txt,.md,.tsv,.csv,.xlsx,.xls,.xlsm,.ods,.docx,.pdf,.pptx">
<input type="file" id="pdfInput" accept=".pdf,.docx,.pptx,.txt,.xlsx" style="display:none">
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
/* ============ DỮ LIỆU ============
   localStorage: lessons, progress, notes
   IndexedDB: file gốc của từng bài (PDF, Word...) */
const KEY = 'meo-xanh-v1';
const KEY_API = 'meo-xanh-apikey';
const PAGE_LESSONS = 10;
const PAGE_WORDS = 20;
const HANGUL = /[ᄀ-ᇿ㄰-㆏가-힯]/;
const HANGUL_START = /^[ᄀ-ᇿ㄰-㆏가-힯]/;
const TYPE_LABEL = {vocab: 'Từ vựng', 'ko-vi': 'Dịch Hàn → Việt', 'vi-ko': 'Dịch Việt → Hàn', grammar: 'Ngữ pháp / bài giảng', talk: 'Giao tiếp AI'};
const TYPE_MODE = {vocab: 'flash', 'ko-vi': 'tr', 'vi-ko': 'tr', grammar: 'grammar', talk: 'talk'};
const TYPE_BTN = {vocab: 'Thẻ học', 'ko-vi': 'Dịch', 'vi-ko': 'Dịch', grammar: 'Bài giảng', talk: 'Hội thoại'};

let state = load();
const ui = {
  view: 'library', folder: '', libPage: 1,
  lessonId: null, filter: 'all', wordsPage: 1,
  flashOrder: null, flashIdx: 0, flipped: false,
  quiz: null, sentWord: null,
  trDir: 'ko-vi', trWord: null, trAns: null,
  msgs: [], notesFilter: '', attachId: null, fileUrl: null
};

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.lessons)){
      return {
        lessons: s.lessons.map(l => ({type: 'vocab', hasFile: false, ...l})),
        progress: s.progress || {},
        notes: s.notes || []
      };
    }
  }catch(e){}
  return {lessons: [], progress: {}, notes: []};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Không lưu được dữ liệu trên trình duyệt này'); }
}

/* ============ TIỆN ÍCH ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D')
  .toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
const findLesson = id => state.lessons.find(l => l.id === id);
const curLesson = () => { const l = findLesson(ui.lessonId) || state.lessons[0] || null; if(l) ui.lessonId = l.id; return l; };
const prog = id => state.progress[id] || {known: false, right: 0, wrong: 0};
function setProg(id, patch){ state.progress[id] = {...prog(id), ...patch}; save(); }
const pctKnown = l => l.words.length ? Math.round(100 * l.words.filter(w => prog(w.id).known).length / l.words.length) : 0;
// Các từ theo bộ lọc chung (tất cả / chưa thuộc / đã thuộc)
const pool = l => l.words.filter(w => ui.filter === 'all' || (ui.filter === 'known') === prog(w.id).known);

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function pager(total, page, per, key){
  const pages = Math.max(1, Math.ceil(total / per));
  if(pages <= 1) return '';
  return `<div class="pager">
    <button class="ghost" data-pg="${key}" data-to="${page - 1}" ${page <= 1 ? 'disabled' : ''}>← Trước</button>
    <span class="meta">Trang ${page} / ${pages}</span>
    <button class="ghost" data-pg="${key}" data-to="${page + 1}" ${page >= pages ? 'disabled' : ''}>Sau →</button>
  </div>`;
}
const clampPage = (p, total, per) => Math.min(Math.max(1, p), Math.max(1, Math.ceil(total / per)));

function emptyMsg(text = 'Chưa có bài học nào. Vào Thư viện để tải file lên trước nhé.'){
  return `<div class="panel empty"><p>${text}</p><button data-go="library">Mở Thư viện</button></div>`;
}
function lessonSelect(){
  return `<select data-pick="lesson" aria-label="Chọn bài">${state.lessons.map(l =>
    `<option value="${l.id}" ${l.id === ui.lessonId ? 'selected' : ''}>${esc(l.folder)} › ${esc(l.name)}</option>`).join('')}</select>`;
}
function filterBar(){
  return `<div class="chips" aria-label="Lọc từ">${[['all', 'Tất cả'], ['unknown', 'Chưa thuộc'], ['known', 'Đã thuộc']]
    .map(([k, t]) => `<button class="chip ${ui.filter === k ? 'on' : ''}" data-act="filter" data-v="${k}">${t}</button>`).join('')}</div>`;
}
// Thanh đầu của các màn học: chọn bài + lọc từ (dùng chung cho mọi chế độ)
function studyTop(l, extra = ''){
  const n = pool(l).length;
  return `<div class="panel">
    <div class="row">${lessonSelect()}</div>
    ${filterBar()}
    ${extra}
    <p class="hint">${n} từ trong mục đang chọn</p>
  </div>`;
}
function modeButtons(l){
  const b = (mode, label) => `<button class="soft" data-act="lesson" data-id="${l.id}" data-mode="${mode}">${label}</button>`;
  return b('flash', 'Thẻ học') + b('quiz', 'Trắc nghiệm') + b('sent', 'Đặt câu') + b('tr', 'Dịch') + b('talk', 'Hội thoại AI') + (l.hasFile ? b('grammar', 'Bài giảng') : '');
}
function resetStudy(){
  ui.flashOrder = null; ui.flashIdx = 0; ui.flipped = false;
  ui.quiz = null; ui.sentWord = null; ui.trWord = null; ui.trAns = null;
  ui.wordsPage = 1; ui.msgs = [];
}

/* ============ LƯU FILE GỐC (IndexedDB) ============ */
let dbPromise = null;
function db(){
  return dbPromise ||= new Promise((res, rej) => {
    const r = indexedDB.open('meo-xanh-files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function putFile(id, blob){
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction('files', 'readwrite'); t.objectStore('files').put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function getFile(id){
  const d = await db();
  return new Promise((res, rej) => { const r = d.transaction('files').objectStore('files').get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); });
}
async function delFile(id){
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction('files', 'readwrite'); t.objectStore('files').delete(id); t.oncomplete = res; t.onerror = () => rej(t.error); });
}

/* ============ ĐỌC FILE ============ */
// Một dòng → {ko, vi}. Nhận: "사과 - táo", "사과: táo", "사과 | táo", tab (Excel), hoặc "사과 táo"
function parseLine(raw){
  let line = raw.replace(/ /g, ' ').trim().replace(/^\d+\s*[.)]\s+/, '');
  if(!line) return null;
  let ko, vi;
  if(line.includes('\t')){
    const cells = line.split('\t').map(s => s.trim()).filter(Boolean);
    const i = cells.findIndex(c => HANGUL.test(c));
    if(i < 0) return null;
    ko = cells[i];
    vi = cells.filter((_, j) => j !== i).join(' · ');
  } else {
    const m = line.match(/\s*(\||:|=|,| - | – | — )\s*/);
    if(m){
      ko = line.slice(0, m.index).trim();
      vi = line.slice(m.index + m[0].length).trim();
    } else {
      // Không có dấu ngăn: chỉ nhận khi dòng bắt đầu bằng tiếng Hàn (tránh nhận nhầm tiêu đề, câu tiếng Việt)
      if(!HANGUL_START.test(line)) return null;
      const sp = line.search(/\s/);
      ko = sp < 0 ? line : line.slice(0, sp);
      vi = sp < 0 ? '' : line.slice(sp).trim();
    }
  }
  if(!HANGUL.test(ko)){
    if(HANGUL.test(vi)) [ko, vi] = [vi, ko];
    else return null;
  }
  if(ko.length > 60) return null;
  return {ko, vi};
}

function need(lib, name){ if(typeof lib === 'undefined') throw new Error(`thiếu thư viện đọc ${name}, kiểm tra kết nối mạng`); }

async function fileToLines(file){
  const ext = file.name.split('.').pop().toLowerCase();
  const buf = await file.arrayBuffer();

  if(['txt', 'md', 'tsv'].includes(ext)) return new TextDecoder('utf-8').decode(buf).split(/\r?\n/);

  if(['csv', 'xlsx', 'xls', 'xlsm', 'ods'].includes(ext)){
    need(window.XLSX, 'Excel/CSV');
    const wb = XLSX.read(buf, {type: 'array'});
    const lines = [];
    wb.SheetNames.forEach(n => XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, defval: '', blankrows: false})
      .forEach(r => lines.push(r.map(c => String(c).trim()).join('\t'))));
    return lines;
  }
  if(ext === 'docx'){
    need(window.mammoth, 'Word');
    const {value} = await mammoth.convertToHtml({arrayBuffer: buf});
    const doc = new DOMParser().parseFromString(value, 'text/html');
    const lines = [];
    doc.body.querySelectorAll('p, li, tr').forEach(el => {
      if(el.tagName === 'TR') lines.push([...el.children].map(td => td.textContent.trim()).join('\t'));
      else if(!el.closest('td, th')) lines.push(el.textContent);
    });
    return lines;
  }
  if(ext === 'pdf'){
    need(window.pdfjsLib, 'PDF');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(buf)}).promise;
    const lines = [];
    for(let p = 1; p <= pdf.numPages; p++){
      const tc = await (await pdf.getPage(p)).getTextContent();
      let cur = '';
      tc.items.forEach(it => {
        if(it.hasEOL){ lines.push((cur + it.str).trim()); cur = ''; }
        else cur += it.str + ' ';
      });
      if(cur.trim()) lines.push(cur.trim());
    }
    return lines;
  }
  if(ext === 'pptx'){
    need(window.JSZip, 'PowerPoint');
    const zip = await JSZip.loadAsync(buf);
    const num = f => parseInt(f.match(/slide(\d+)\.xml$/)[1], 10);
    const slides = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a, b) => num(a) - num(b));
    const paraText = el => [...el.getElementsByTagName('a:t')].map(t => t.textContent).join('');
    const inTable = el => { for(let n = el.parentNode; n; n = n.parentNode) if(n.nodeName === 'a:tc') return true; return false; };
    const lines = [];
    for(const f of slides){
      const xml = new DOMParser().parseFromString(await zip.file(f).async('string'), 'application/xml');
      for(const tr of xml.getElementsByTagName('a:tr')) lines.push([...tr.getElementsByTagName('a:tc')].map(paraText).join('\t'));
      for(const p of xml.getElementsByTagName('a:p')) if(!inTable(p)) lines.push(paraText(p));
    }
    return lines;
  }
  throw new Error(`định dạng .${ext} chưa hỗ trợ; file .doc/.ppt cũ hãy lưu lại thành .docx/.pptx`);
}

async function importFiles(files){
  const folder = $('#folderName').value.trim() || 'Chưa xếp thư mục';
  const type = $('#uploadType').value;
  const msg = $('#uploadMsg');
  let ok = 0;
  const fails = [];
  for(const f of files){
    msg.textContent = `Đang đọc ${f.name}…`;
    try{
      const seen = new Set();
      const words = [];
      (await fileToLines(f)).forEach(l => {
        const w = parseLine(l);
        if(w && !seen.has(w.ko)){ seen.add(w.ko); words.push(w); }
      });
      if(!words.length && type !== 'grammar'){ fails.push(`${f.name} (không tìm thấy từ nào)`); continue; }
      const id = 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const lesson = {
        id, folder, type,
        name: f.name.replace(/\.[^.]+$/, ''),
        hasFile: false, fileName: f.name,
        words: words.map((w, i) => ({id: id + '_' + i, ko: w.ko, vi: w.vi}))
      };
      try{ await putFile(id, f); lesson.hasFile = true; } catch(e){}
      state.lessons.push(lesson);
      ok++;
    }catch(e){
      fails.push(`${f.name} (${e.message})`);
    }
  }
  save();
  msg.textContent = (ok ? `Đã thêm ${ok} bài vào "${folder}".` : '') + (fails.length ? ' Không đọc được: ' + fails.join('; ') : '');
  if(ok) toast(`Đã thêm ${ok} bài`);
  ui.folder = folder;
  renderView();
}

function flashStep(d){
  const l = curLesson(); if(!l) return;
  const ids = flashIds(l);
  if(!ids.length) return;
  ui.flashIdx = (ui.flashIdx + d + ids.length) % ids.length;
  ui.flipped = false;
  renderView();
}
function flashMark(known){
  const l = curLesson(); if(!l) return;
  const ids = flashIds(l);
  if(!ids.length) return;
  const id = ids[ui.flashIdx];
  setProg(id, {known});
  if(ui.filter !== 'all'){
    // Đang lọc: từ vừa đánh dấu không còn thuộc nhóm này, bỏ khỏi vòng học
    ids.splice(ui.flashIdx, 1);
    if(ui.flashIdx >= ids.length) ui.flashIdx = 0;
    ui.flipped = false;
    renderView();
  } else {
    flashStep(1);
  }
}

/* ============ TRẮC NGHIỆM ============ */
function makeOptions(w, own){
  // Đáp án nhiễu: ưu tiên từ khác trong cùng bài, rồi đến các bài khác
  const others = shuffle(own.filter(x => x.id !== w.id))
    .concat(shuffle(state.lessons.flatMap(l => l.words).filter(x => x.vi && x.id !== w.id && !own.includes(x))));
  const opts = [w];
  const seen = new Set([w.vi]);
  for(const x of others){
    if(opts.length >= 4) break;
    if(x.vi && !seen.has(x.vi)){ seen.add(x.vi); opts.push(x); }
  }
  return shuffle(opts);
}
function startQuiz(){
  const l = curLesson(); if(!l) return;
  const own = pool(l).filter(w => w.vi);
  const total = state.lessons.flatMap(x => x.words).filter(w => w.vi).length;
  if(!own.length || total < 4){
    toast(own.length ? 'Cần ít nhất 4 từ có nghĩa để làm trắc nghiệm' : 'Không còn từ nào có nghĩa trong mục này');
    return;
  }
  const items = shuffle(own);
  ui.quiz = {items, i: 0, score: 0, answered: null, own, opts: makeOptions(items[0], own)};
  renderQuiz();
}
function renderQuiz(){
  const box = $('#v-quiz');
  const l = curLesson();
  if(!l){ box.innerHTML = emptyMsg(); return; }
  const q = ui.quiz;
  let body;
  if(!q){
    body = `<div class="panel empty">
      <p>Xem từ tiếng Hàn, chọn nghĩa đúng trong 4 đáp án A, B, C, D.<br>Đang lọc: <b>${{all: 'tất cả từ', known: 'từ đã thuộc', unknown: 'từ chưa thuộc'}[ui.filter]}</b></p>
      <button data-act="quizStart">Bắt đầu</button>
    </div>`;
  } else if(q.i >= q.items.length){
    body = `<div class="panel empty">
      <h2>Xong rồi!</h2>
      <p>Đúng ${q.score} / ${q.items.length} câu (${Math.round(100 * q.score / q.items.length)}%)</p>
      <div class="row" style="justify-content:center">
        <button data-act="quizStart">Làm lại</button>
        <button class="ghost" data-act="back">Về thư viện</button>
      </div>
    </div>`;
  } else {
    const w = q.items[q.i];
    const correct = q.opts.findIndex(o => o.id === w.id);
    body = `<div class="panel">
      <div class="meta">Câu ${q.i + 1} / ${q.items.length} · Đúng: ${q.score}</div>
      <div class="ko" style="font-size:clamp(30px,8vw,46px);text-align:center;margin:18px 0">${esc(w.ko)}</div>
      <p class="hint" style="text-align:center;margin-top:-8px">Chọn nghĩa đúng (phím 1–4)</p>
      ${q.opts.map((o, i) => {
        let cls = '';
        if(q.answered !== null){
          if(i === correct) cls = 'right';
          else if(i === q.answered) cls = 'wrong';
        }
        return `<button class="opt ${cls}" data-act="quizPick" data-i="${i}">${'ABCD'[i]}. ${esc(o.vi)}</button>`;
      }).join('')}
      ${q.answered !== null ? `<div class="row" style="justify-content:flex-end;margin-top:8px">
        <button data-act="quizNext">${q.i + 1 < q.items.length ? 'Câu tiếp →' : 'Xem kết quả'}</button>
      </div>` : ''}
    </div>`;
  }
  box.innerHTML = studyTop(l) + body;
}
function answerQuiz(i){
  const q = ui.quiz;
  if(!q || q.i >= q.items.length || q.answered !== null || !q.opts[i]) return;
  const w = q.items[q.i];
  const ok = q.opts[i].id === w.id;
  q.answered = i;
  if(ok) q.score++;
  const p = prog(w.id);
  setProg(w.id, {right: p.right + (ok ? 1 : 0), wrong: p.wrong + (ok ? 0 : 1)});
  renderQuiz();
}
function nextQuiz(){
  const q = ui.quiz;
  if(!q || q.answered === null) return;
  q.i++;
  if(q.i < q.items.length) q.opts = makeOptions(q.items[q.i], q.own);
  q.answered = null;
  renderQuiz();
}

      <div class="ko" style="font-size:clamp(30px,8vw,46px)">${esc(w.ko)}</div>
      <p class="vi-line" style="font-size:17px;margin:10px 0">Nghĩa: <b>${w.vi ? esc(w.vi) : 'chưa có nghĩa trong file'}</b></p>
      <p class="hint">Viết một câu tiếng Hàn có dùng từ trên, rồi bấm Kiểm tra.</p>
      <textarea id="sentText" rows="3" placeholder="Viết câu tiếng Hàn ở đây…" style="margin-top:10px"></textarea>
      <div id="sentResult" class="hint" style="min-height:24px;margin:10px 0"></div>
      <div class="row actions">
        <button class="ghost" data-act="sentNext">Từ khác →</button>
        <button data-act="sentCheck">Kiểm tra</button>
      </div>
      <p class="hint">Phím tắt: Ctrl + Enter để kiểm tra</p>
      ${p.right ? `<p class="hint">Đã đặt câu đúng ${p.right} lần</p>` : ''}
    </div>`;
}
function checkSent(){
  const l = curLesson();
  const w = l && l.words.find(x => x.id === ui.sentWord);
  const box = $('#sentText'), res = $('#sentResult');
  if(!w || !box) return;
  const text = box.value.trim();
  if(!HANGUL.test(text)){
    res.style.color = 'var(--bad)';
    res.textContent = 'Hãy viết câu bằng tiếng Hàn trước.';
    return;
  }
  // Động từ/tính từ đuôi 다: kiểm tra phần gốc để nhận dạng đã chia (먹다 → 먹어요)
  const key = w.ko.length > 1 && w.ko.endsWith('다') ? w.ko.slice(0, -1) : w.ko;
  const ok = text.includes(key);
  res.style.color = ok ? 'var(--ok)' : 'var(--bad)';
  res.textContent = ok ? `✔ Đúng! Bạn đã dùng từ «${w.ko}».` : `Câu chưa có từ «${w.ko}» (hoặc dạng đã chia của nó). Thử lại nhé.`;
  if(ok) setProg(w.id, {right: prog(w.id).right + 1});
}

/* ============ DỊCH ============ */
function renderTr(){
  const box = $('#v-tr');
  const l = curLesson();
  if(!l){ box.innerHTML = emptyMsg(); return; }
  const dirBar = `<div class="chips">${[['ko-vi', 'Hàn → Việt'], ['vi-ko', 'Việt → Hàn']]
    .map(([k, t]) => `<button class="chip ${ui.trDir === k ? 'on' : ''}" data-act="trdir" data-v="${k}">${t}</button>`).join('')}</div>`;
  const list = pool(l).filter(w => w.vi);
  if(!list.length){ box.innerHTML = studyTop(l, dirBar) + '<div class="panel empty">Không có từ có nghĩa trong mục này.</div>'; return; }
  if(!list.some(w => w.id === ui.trWord)) ui.trWord = shuffle(list)[0].id;
  const w = list.find(x => x.id === ui.trWord);
  const toKo = ui.trDir === 'vi-ko';
  const q = toKo ? w.vi : w.ko;
  const ask = toKo ? 'Viết từ tiếng Hàn tương ứng' : 'Viết nghĩa tiếng Việt';
  const a = ui.trAns;
  const verdict = a ? {ok: ['✔ Đúng!', 'var(--ok)'], near: ['Gần đúng', 'var(--blue-ink)'], bad: ['Chưa đúng', 'var(--bad)']}[a.verdict] : null;
  box.innerHTML = studyTop(l, dirBar) + `
    <div class="panel" style="text-align:center">
      <div class="ko" style="font-size:clamp(28px,7vw,42px);margin:10px 0">${esc(q)}</div>
      <p class="hint">${ask}</p>
      <input id="trIn" style="margin-top:10px;text-align:center" placeholder="Nhập đáp án…" autocomplete="off" ${a ? 'disabled' : ''} value="${a ? esc(a.v) : ''}">
      <div id="trRes" class="hint" style="min-height:48px;margin:10px 0;font-size:15px">${a ? `<b style="color:${verdict[1]}">${verdict[0]}</b><br>Đáp án: <b>${esc(toKo ? w.ko : w.vi)}</b>` : ''}</div>
      <div class="row actions">
        <button class="ghost" data-act="trNext">Câu khác →</button>
        ${a ? '' : '<button data-act="trCheck">Kiểm tra</button>'}
      </div>
    </div>`;
  if(!a) $('#trIn').focus();
}
function trCheck(){
  const l = curLesson();
  const w = l && l.words.find(x => x.id === ui.trWord);
  const v = $('#trIn') ? $('#trIn').value.trim() : '';
  if(!w || !v){ toast('Nhập đáp án trước'); return; }
  let verdict;
  if(ui.trDir === 'ko-vi'){
    const exp = norm(w.vi).split(' ').filter(Boolean);
    const got = new Set(norm(v).split(' '));
    const hit = exp.length ? exp.filter(t => got.has(t)).length / exp.length : 0;
    verdict = hit >= 0.8 ? 'ok' : hit >= 0.5 ? 'near' : 'bad';
  } else {
    const strip = s => norm(s).replace(/ /g, '');
    verdict = strip(v).includes(strip(w.ko)) ? 'ok' : 'bad';
  }
  ui.trAns = {verdict, v};
  renderTr();
}
function trNext(){ ui.trWord = null; ui.trAns = null; renderTr(); }

/* ============ HỘI THOẠI AI ============ */
const getKey = () => { try{ return localStorage.getItem(KEY_API) || ''; } catch(e){ return ''; } };

function renderTalk(){
  const box = $('#v-talk');
  const l = curLesson();
  if(!l){ box.innerHTML = emptyMsg(); return; }
  const key = getKey();
  const chips = l.words.slice(0, 15).map(w =>
    `<button class="chip" data-act="insertWord" data-v="${esc(w.ko)}">${esc(w.ko)}${w.vi ? ` <span class="meta">${esc(w.vi)}</span>` : ''}</button>`).join('');
  const opener = `안녕하세요! 오늘은 「${l.name}」 주제로 이야기해 볼까요?`;
  const bubbles = ui.msgs.length
    ? ui.msgs.map(m => `<div class="bubble ${m.role === 'user' ? 'me' : 'ai'}">${esc(m.content)}</div>`).join('')
    : `<div class="bubble ai">${esc(opener)}\n${key ? '(Hãy trả lời bằng tiếng Hàn nhé)' : '(Muốn trò chuyện với AI, hãy nhập API key ở dưới.)'}</div>`;
  box.innerHTML = studyTop(l) + `
    <div class="panel">
      <p class="hint" style="margin:0 0 8px">Chủ đề: <b>${esc(l.name)}</b>. Bấm từ gợi ý để chèn vào câu của bạn.</p>
      <div class="chips">${chips || '<span class="hint">Bài này chưa có từ vựng.</span>'}</div>
    </div>
    <div class="panel">
      <div class="chat" id="chat">${bubbles}</div>
      <div class="row">
        <input id="talkIn" placeholder="Viết câu tiếng Hàn (hoặc tiếng Việt nếu cần)…" style="flex:1;min-width:200px">
        <button data-act="talkSend">Gửi</button>
      </div>
      <p class="hint">${key ? 'AI sẽ trả lời, dịch nghĩa và gợi ý cách đáp lại theo chủ đề.' : 'Chưa có API key nên chưa trò chuyện được với AI.'}</p>
    </div>
    <details class="panel">
      <summary style="cursor:pointer;font-weight:600">Cài đặt AI (API key Anthropic)</summary>
      <div class="row" style="margin-top:10px">
        <input id="apiKey" type="password" placeholder="sk-ant-…" value="${esc(key)}" style="flex:1;min-width:200px">
        <button class="ghost" data-act="saveKey">Lưu key</button>
      </div>
      <p class="hint">Key chỉ lưu trên máy này. Ai có key đều dùng được tài khoản của bạn, đừng chia sẻ.</p>
    </details>`;
  const chat = $('#chat');
  chat.scrollTop = chat.scrollHeight;
}
async function askAI(l, msgs){
  const system = `Bạn là bạn hội thoại tiếng Hàn kiên nhẫn cho người Việt đang học.
Chủ đề: "${l.name}".
Từ vựng nên dùng: ${l.words.slice(0, 30).map(w => `${w.ko}${w.vi ? ' (' + w.vi + ')' : ''}`).join(', ') || 'không có, tự chọn chủ đề phù hợp'}.
Mỗi lượt trả lời theo đúng 3 phần:
1) Câu trả lời bằng tiếng Hàn ngắn gọn, rồi hỏi lại người học một câu.
2) "📝 Dịch:" nghĩa tiếng Việt của phần 1.
3) "💡 Gợi ý trả lời:" đưa 2–3 câu tiếng Hàn người học có thể đáp lại, kèm nghĩa tiếng Việt.
Nếu người học viết sai, sửa nhẹ nhàng và giải thích ngắn bằng tiếng Việt.`;
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': getKey(),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({model: 'claude-haiku-5-5', max_tokens: 700, system, messages: msgs.map(m => ({role: m.role, content: m.content}))})
  });
  if(!r.ok) throw new Error(`AI trả lỗi ${r.status}, kiểm tra lại API key`);
  const data = await r.json();
  return data.content.map(c => c.text || '').join('').trim();
}
async function talkSend(){
  const input = $('#talkIn');
  const text = input ? input.value.trim() : '';
  const l = curLesson();
  if(!text || !l) return;
  if(!getKey()){ toast('Nhập API key ở phần Cài đặt AI trước'); return; }
  ui.msgs.push({role: 'user', content: text});
  renderTalk();
  try{
    const reply = await askAI(l, ui.msgs);
    ui.msgs.push({role: 'assistant', content: reply});
  }catch(e){
    ui.msgs.pop();
    $('#talkIn').value = text;
    toast(e.message);
  }
  renderTalk();
}

/* ============ BÀI GIẢNG (file gốc) ============ */
async function renderGrammar(){
  const box = $('#v-grammar');
  const l = curLesson();
  if(!l){ box.innerHTML = emptyMsg(); return; }
  box.innerHTML = `<div class="panel row between">
      <button class="ghost" data-act="back">← Thư viện</button>
      ${lessonSelect()}
    </div>
    <div class="panel" id="gBody"><p class="hint">Đang mở file…</p></div>`;
  const body = $('#gBody');
  if(!l.hasFile){
    body.innerHTML = `<p class="empty">Bài này chưa có file bài giảng.</p>
      <div class="row" style="justify-content:center"><button data-act="attach" data-id="${l.id}">Đính kèm file PDF</button></div>`;
    return;
  }
  let blob = null;
  try{ blob = await getFile(l.id); } catch(e){}
  if(ui.view !== 'grammar') return;
  if(!blob){ body.innerHTML = '<p class="empty">Không mở được file đã lưu. Hãy đính kèm lại.</p>'; return; }
  if(ui.fileUrl) URL.revokeObjectURL(ui.fileUrl);
  ui.fileUrl = URL.createObjectURL(blob);
  const isPdf = blob.type === 'application/pdf' || /\.pdf$/i.test(l.fileName || '');
  body.innerHTML = isPdf
    ? `<iframe class="pdf" src="${ui.fileUrl}" title="Bài giảng"></iframe>
       <p class="hint"><a href="${ui.fileUrl}" target="_blank" rel="noopener">Mở trong tab mới</a></p>`
    : `<p class="empty">File này không xem trực tiếp được trong trang.</p>
       <div class="row" style="justify-content:center"><a href="${ui.fileUrl}" download="${esc(l.fileName || 'file')}">Tải file gốc</a></div>`;
}

/* ============ SỔ TAY ============ */
function renderNotes(){
  const box = $('#v-notes');
  const list = state.notes.filter(n => !ui.notesFilter || n.lessonId === ui.notesFilter);
  const lessonName = id => (findLesson(id) || {}).name || '';
  const opts = `<option value="">Tất cả bài</option>` + state.lessons.map(l =>
    `<option value="${l.id}" ${l.id === ui.notesFilter ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
  box.innerHTML = `
    <div class="panel">
      <h2>Sổ tay</h2>
      <p class="hint" style="margin-top:0">Lưu lại từ hoặc câu bạn thấy hay, hoặc cần chú ý. Trong Thẻ học bấm "★ Lưu vào sổ tay" để thêm từ.</p>
      <div class="row" style="margin:10px 0">
        <select data-pick="notesFilter" aria-label="Lọc theo bài" style="flex:1;min-width:200px">${opts}</select>
      </div>
      <textarea id="noteText" rows="2" placeholder="Viết câu hoặc ghi chú…"></textarea>
      <div class="row between" style="margin-top:8px">
        <select id="noteLesson" style="flex:1;min-width:200px">
          <option value="">Không gắn với bài nào</option>
          ${state.lessons.map(l => `<option value="${l.id}" ${l.id === ui.notesFilter ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}
        </select>
        <button data-act="addNote">Thêm vào sổ tay</button>
      </div>
    </div>
    <div class="panel">
      ${list.length ? list.map(n => `<div class="note">
        <div class="row between">
          ${n.kind === 'word'
            ? `<div><span class="ko">${esc(n.ko)}</span> <span class="meta">${esc(n.vi)}</span></div>`
            : `<div>${esc(n.text)}</div>`}
          <button class="icon" data-act="delNote" data-id="${n.id}" aria-label="Xóa">🗑</button>
        </div>
        ${n.kind === 'word' && n.text ? `<div class="hint">${esc(n.text)}</div>` : ''}
        ${n.lessonId ? `<div class="hint">${esc(lessonName(n.lessonId))}</div>` : ''}
      </div>`).join('') : '<p class="empty">Chưa có gì trong sổ tay.</p>'}
    </div>`;
}
function addNote(){
  const text = $('#noteText').value.trim();
  if(!text){ toast('Viết nội dung trước'); return; }
  state.notes.unshift({id: 'N' + Date.now().toString(36), kind: 'note', text, lessonId: $('#noteLesson').value || null, at: Date.now()});
  save();
  renderNotes();
  toast('Đã thêm vào sổ tay');
}

/* ============ HỘP THOẠI CHUNG ============ */
function openDialog(title, body, onOk){
  const d = $('#dlg');
  d.innerHTML = `<form class="dlgbox"><h2>${esc(title)}</h2>${body}
    <div class="row actions">
      <button type="button" class="ghost" data-cancel>Hủy</button>
      <button type="submit">Lưu</button>
    </div></form>`;
  const form = d.querySelector('form');
  d.querySelector('[data-cancel]').onclick = () => d.close();
  form.onsubmit = e => {
    e.preventDefault();
    if(onOk(Object.fromEntries(new FormData(form))) !== false) d.close();
  };
  d.showModal();
}

/* ============ SỰ KIỆN ============ */
function act(name, d){
  switch(name){
    case 'pickFile': $('#fileInput').click(); break;
    case 'back': go('library'); break;
    case 'folder': ui.folder = d.v; ui.libPage = 1; renderView(); break;
    case 'lesson':
      ui.lessonId = d.id;
      resetStudy();
      go(d.mode || 'words');
      break;
    case 'filter': ui.filter = d.v; resetStudy(); renderView(); break;
    case 'trdir': ui.trDir = d.v; ui.trWord = null; ui.trAns = null; renderView(); break;
    case 'attach': attachFile(d.id); break;
    case 'editLesson': editLesson(d.id); break;
    case 'delLesson': deleteLesson(d.id); break;
    case 'toggleKnown': setProg(d.id, {known: !prog(d.id).known}); renderView(); break;
    case 'editWord': openWordDialog(d.id); break;
    case 'addWord': addWordFromForm(); break;
    case 'delWord': deleteWord(d.id); break;
    case 'flip': ui.flipped = !ui.flipped; renderView(); break;
    case 'prev': flashStep(-1); break;
    case 'next': flashStep(1); break;
    case 'mark': flashMark(d.v === '1'); break;
    case 'shuffleFlash': {
      const l = curLesson();
      if(l){ ui.flashOrder.ids = shuffle(flashIds(l)); ui.flashIdx = 0; ui.flipped = false; renderView(); }
      break;
    }
    case 'saveNote': saveNote(d.id); break;
    case 'quizStart': startQuiz(); break;
    case 'quizPick': answerQuiz(+d.i); break;
    case 'quizNext': nextQuiz(); break;
    case 'sentNext': ui.sentWord = null; renderSent(); break;
    case 'sentCheck': checkSent(); break;
    case 'trCheck': trCheck(); break;
    case 'trNext': trNext(); break;
    case 'insertWord': { const i = $('#talkIn'); if(i){ i.value = (i.value ? i.value + ' ' : '') + d.v; i.focus(); } break; }
    case 'talkSend': talkSend(); break;
    case 'saveKey':
      try{ localStorage.setItem(KEY_API, $('#apiKey').value.trim()); } catch(e){}
      toast('Đã lưu API key');
      renderTalk();
      break;
    case 'addNote': addNote(); break;
    case 'delNote':
      if(confirm('Xóa mục này khỏi sổ tay?')){ state.notes = state.notes.filter(n => n.id !== d.id); save(); renderNotes(); }
      break;
  }
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-go]');
  if(nav){ resetStudy(); go(nav.dataset.go); return; }
  const pg = e.target.closest('[data-pg]');
  if(pg){ ui[pg.dataset.pg] = +pg.dataset.to; renderView(); return; }
  const el = e.target.closest('[data-act]');
  if(el) act(el.dataset.act, el.dataset);
});

document.addEventListener('change', e => {
  const kind = e.target.dataset && e.target.dataset.pick;
  if(!kind) return;
  if(kind === 'lesson'){ ui.lessonId = e.target.value; resetStudy(); }
  if(kind === 'notesFilter'){ ui.notesFilter = e.target.value; }
  renderView();
});

document.addEventListener('keydown', e => {
  const tag = e.target.closest('input, textarea, select');
  if(tag){
    if(e.key === 'Enter' && e.ctrlKey && ui.view === 'sent') checkSent();
    if(e.key === 'Enter' && e.target.id === 'trIn') ui.trAns ? trNext() : trCheck();
    if(e.key === 'Enter' && e.target.id === 'talkIn') talkSend();
    return;
  }
  if(e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  if(ui.view === 'flash'){
    if(e.key === 'ArrowRight') flashStep(1);
    else if(e.key === 'ArrowLeft') flashStep(-1);
    else if(e.key === ' '){ e.preventDefault(); act('flip', {}); }
    else if(e.key === '1') flashMark(false);
    else if(e.key === '2') flashMark(true);
  }
  if(ui.view === 'quiz' && ui.quiz){
    if(/^[1-4]$/.test(e.key)) answerQuiz(+e.key - 1);
    else if(e.key === 'Enter') nextQuiz();
  }
});

// Kéo thả file
const drop = $('#drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if(e.dataTransfer.files.length) importFiles([...e.dataTransfer.files]); });

$('#fileInput').addEventListener('change', e => {
  if(e.target.files.length) importFiles([...e.target.files]);
  e.target.value = '';
});
$('#pdfInput').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  const l = findLesson(ui.attachId);
  if(!f || !l) return;
  try{
    await putFile(l.id, f);
    l.hasFile = true;
    l.fileName = f.name;
    save();
    toast('Đã đính kèm file bài giảng');
  }catch(err){
    toast('Không lưu được file: ' + err.message);
  }
  renderView();
});

go('library');
</script>
