<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f63a8">
<title>Mèo xanh – Học tiếng Hàn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#f6f6f2; --card:#ffffff; --ink:#1c2430; --muted:#6b7280; --line:#e5e5df;
    --primary:#2f63a8; --soft:#e9f0f9; --soft-ink:#2f63a8;
    --ok:#2f7d4f; --ok-bg:#e6f3eb;
    --warn:#a85a1a; --warn-bg:#fbf0e4;
    --mid:#7a6a1c; --mid-bg:#f8f3d9;
    --bad:#b4434b; --bad-bg:#fbe9ea;
    --r:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5;font-size:15px}
  a{color:inherit}
  button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;min-height:42px;background:var(--primary);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;white-space:nowrap}
  button.ghost,.btn.ghost{background:var(--card);color:var(--primary);border:1px solid var(--line)}
  button.soft,.btn.soft{background:var(--soft);color:var(--soft-ink)}
  button.icon{background:transparent;color:var(--muted);min-height:34px;min-width:34px;padding:4px 8px;border-radius:10px}
  button.icon:hover{background:var(--soft)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #b9d2f0;outline-offset:2px}
  input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:42px;background:var(--card);color:var(--ink);width:100%}
  textarea{resize:vertical}
  input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--primary);flex:none}
  label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
  .hidden{display:none!important}

  .app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
  aside.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:25px;letter-spacing:.3px;text-decoration:none;display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--primary);padding:0 8px 16px}
  .logo{width:40px;height:32px;flex:none}
  .newbtn{width:100%;margin-bottom:14px}
  .navlink{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink);margin-bottom:2px}
  .navlink:hover{background:#f1f3f6}
  .navlink.on{background:var(--soft);color:var(--primary);font-weight:600}
  .count{background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
  .sec{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px;margin:22px 12px 8px}
  .lessonlink{display:block;padding:7px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lessonlink:hover{background:#f1f3f6}
  .lessonlink.on{background:var(--soft);color:var(--primary);font-weight:600}
  .folderbtn{display:flex;align-items:center;gap:8px;width:100%;background:transparent;color:var(--ink);text-align:left;padding:8px 12px;margin-top:4px;border-radius:10px;font-size:14px;font-weight:600;min-height:0}
  .folderbtn:hover{background:#f1f3f6}
  .folderbtn .caret{color:var(--muted);width:12px;flex:none}
  .folderbtn .count2{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
  .lessonlink{padding-left:30px!important}
  .gcard{margin-bottom:12px}
  .gko{font-size:22px;margin:8px 0 4px}
  .gex{background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0}
  .gblock{font-size:14px;margin-top:8px;white-space:pre-line}

  main{padding:28px 32px 60px;max-width:1080px;width:100%;min-width:0}
  h1{font-size:26px;margin:0 0 6px;font-weight:800}
  h2{font-size:18px;margin:0 0 12px;font-weight:700}
  h3.step{font-size:16px;margin:26px 0 12px;font-weight:700;color:var(--ink)}
  h3.step b{color:var(--primary)}
  .sub{color:var(--muted);margin:0 0 6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .card + .card{margin-top:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .between{justify-content:space-between}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .meta{color:var(--muted);font-size:13px}
  .hint{color:var(--muted);font-size:13px;margin:6px 0 0}
  .empty{text-align:center;color:var(--muted);padding:18px}
  .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:600}
  .ko{font-weight:700}
  .badge{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--soft-ink)}
  .b-ok{background:var(--ok-bg);color:var(--ok)} .b-mid{background:var(--mid-bg);color:var(--mid)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-gray{background:#eef0f2;color:var(--muted)}
  .track{height:8px;background:#e9e9e4;border-radius:8px;overflow:hidden}
  .fill{height:100%;background:var(--primary);border-radius:8px}
  .fill.ok{background:var(--ok)}
  .chip{background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:34px;padding:6px 14px;border-radius:999px;font-size:14px}
  .chip.on{background:var(--soft);color:var(--primary);border-color:#c9d9ef;font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap}

  /* Trang chủ: tải tài liệu + chọn nội dung */
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative}
  .slot.dashed{border:1.5px dashed #b9c9de;background:#fbfcfe}
  .slot.over{border-color:var(--primary);background:var(--soft)}
  .slot .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .slot .t{font-weight:700}
  .slot .types{font-size:13px;color:var(--muted)}
  .fileline{margin-top:auto;background:#f5f5f1;border-radius:10px;padding:9px 12px;font-size:14px;word-break:break-all;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .tip{font-size:13px;color:var(--muted);margin:10px 2px 0}
  .checks .opt{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
  .checks .opt:last-child{border-bottom:0}
  .checks .opt .lbl{flex:1}
  .checks .opt .n{color:var(--muted);font-size:14px;white-space:nowrap}
  .checks select{width:auto;min-height:36px;padding:4px 10px}
  .recog{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--soft);border-radius:var(--r);padding:16px 18px;margin-top:16px}
  .recog .s{font-weight:600}
  .lessongrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .lcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none}
  .lcard:hover{border-color:#c9d9ef}
  .ltitle{font-weight:700;color:var(--ink);text-decoration:none;font-size:16px}
  .ltitle:hover{color:var(--primary)}

  /* Chi tiết bài */
  .crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
  .crumb a{text-decoration:none;color:var(--muted)}
  .lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .files{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .file{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .stat .l{font-size:14px;color:var(--muted)}
  .stat .v{font-size:24px;font-weight:700;margin:4px 0 8px}
  .stat .v small{font-size:14px;color:var(--muted);font-weight:500}
  .ovgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px;align-items:start}
  table.words{width:100%;border-collapse:collapse}
  table.words th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
  table.words td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.acts{white-space:nowrap;text-align:right}
  .addrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}

  /* Thẻ học */
  .fwrap{max-width:680px;margin:0 auto}
  .modebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .progress-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 0 6px}
  .fcard{touch-action:pan-y;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:28px;cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 22px rgba(28,36,48,.05)}
  .fcard .fw{font-size:clamp(34px,9vw,54px);font-weight:700;word-break:keep-all}
  .fcard .fb{font-size:clamp(18px,4.5vw,24px);color:var(--primary);font-weight:600}
  .fcard .hint{margin-top:8px}
  .lvbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .lvbtns button{min-height:50px}
  .lv0{background:var(--warn-bg)!important;color:var(--warn)!important}
  .lv1{background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important}
  .lv2{background:var(--ok-bg)!important;color:var(--ok)!important}
  .fnote{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}

  /* Luyện viết */
  .subtabs{display:grid;grid-template-columns:repeat(3,1fr);background:#ebebe6;border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
  .subtabs a{text-align:center;padding:9px;border-radius:9px;text-decoration:none;color:var(--muted);font-size:14px}
  .subtabs a.on{background:var(--card);color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .wcard{max-width:760px;margin:0 auto}
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .qword{font-size:clamp(22px,5vw,28px);font-weight:700;margin:6px 0}
  .fb{padding:12px 14px;border-radius:12px;margin-top:12px;font-size:14px}
  .fb.ok{background:var(--ok-bg);color:var(--ok)}
  .fb.near{background:var(--warn-bg);color:var(--warn)}
  .fb.bad{background:var(--bad-bg);color:var(--bad)}
  .writebox{margin-top:14px}

  /* Trắc nghiệm */
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .mcard{aspect-ratio:4/3;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:14px;font:inherit;font-size:clamp(14px,3.4vw,19px);font-weight:600;padding:8px;line-height:1.3;word-break:keep-all;min-height:0}
  .mcard:disabled{opacity:1}
  .mcard.open{background:var(--soft);color:var(--primary);border-color:#c9d9ef}
  .mcard.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
  @media (max-width:640px){.mgrid{grid-template-columns:repeat(3,1fr);gap:8px}}
  .testset .srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 4px;border-bottom:1px solid var(--line);font-size:16px}
  .testset .srow:last-of-type{border-bottom:0}
  .testset .wide{width:100%;margin-top:18px;min-height:50px;font-size:16px}
  input.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;min-height:0;border-radius:20px;background:#cfd6e0;position:relative;cursor:pointer;flex:none;transition:background .2s;padding:0;border:0}
  input.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  input.sw:checked{background:var(--primary)}
  input.sw:checked::after{transform:translateX(20px)}
  .inkwrap{margin-top:12px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tool{background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:40px;padding:8px 14px}
  .tool.on{background:var(--soft);color:var(--primary);border-color:#c9d9ef;font-weight:600}
  .tool:disabled{opacity:.4}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);background:#ebebe6;border-radius:12px;padding:4px;gap:4px}
  .seg button{background:transparent;color:var(--muted);min-height:38px;padding:6px 4px;font-size:14px}
  .seg button.on{background:var(--card);color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .prompt{font-family:'Noto Sans KR',system-ui,sans-serif;text-align:center;font-size:clamp(34px,9vw,56px);font-weight:700;line-height:1.25;margin:18px 0 8px;word-break:keep-all}
  .prompt.ko{color:var(--ink)}
  .wfb{min-height:0}
  .ink{width:100%;height:240px;border:1.5px dashed #b9c9de;border-radius:14px;background:#fff;touch-action:none;display:block;cursor:crosshair}
  .opt:disabled{opacity:1}
  .opt.picked{border-color:var(--primary);background:var(--soft)}
  .opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;font-size:16px;font-weight:500}
  .opt:hover{background:#f7f9fc}
  .opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

  /* Hội thoại */
  .chat{min-height:200px;max-height:50vh;overflow-y:auto;display:grid;gap:10px;padding:4px;margin-bottom:12px}
  .bubble{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;font-size:15px}
  .bubble.me{justify-self:end;background:var(--soft);color:var(--primary);border-bottom-right-radius:4px}
  .bubble.ai{justify-self:start;background:#f3f3ef;border-bottom-left-radius:4px}
  .pdf{width:100%;height:72vh;border:1px solid var(--line);border-radius:12px;background:#fff}
  .note{padding:12px 0;border-bottom:1px solid var(--line)}
  .note:last-child{border-bottom:0}

  dialog{border:0;border-radius:18px;padding:0;max-width:460px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.2)}
  dialog::backdrop{background:rgba(28,36,48,.35)}
  .dlgbox{padding:22px}
  .dlgbox .actions{margin-top:8px}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;z-index:30}
  #toast.show{opacity:1;transform:translateX(-50%)}

  .kindrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
  .kindrow:last-of-type{border-bottom:0}
  .kindrow input{width:18px;height:18px;min-height:0;accent-color:var(--primary)}
  @media (max-width:1000px){
    .slots{grid-template-columns:1fr 1fr}
    .grid4{grid-template-columns:1fr 1fr}
    .ovgrid{grid-template-columns:1fr}
  }
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    aside.side{position:sticky;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:4px;overflow-x:auto;z-index:5;scrollbar-width:none}
    aside.side::-webkit-scrollbar{display:none}
    .brand{padding:0 8px 0 0;flex:none}
    .newbtn{width:auto;margin:0 6px 0 0;flex:none;padding:8px 14px;min-height:38px}
    .navlink{flex:none;padding:8px 10px;white-space:nowrap}
    .sec,.lessonlist,.folderlabel{display:none}
    main{padding:18px 16px 60px}
    h1{font-size:22px}
  }
  @media (max-width:640px){
    .slots,.lessongrid,.grid2{grid-template-columns:1fr}
    .grid4{grid-template-columns:1fr 1fr}
    .addrow{grid-template-columns:1fr}
    .subtabs a{font-size:13px;padding:8px 4px}
    table.words .hide-sm{display:none}
    .lvbtns{gap:6px}
    .lvbtns button{font-size:14px;padding:8px 4px}
    .fcard{min-height:240px;padding:20px}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <symbol id="cat" viewBox="0 0 120 100">
    <circle cx="22" cy="18" r="7" fill="none" stroke="#f7b8c8" stroke-width="2"/>
    <circle cx="82" cy="20" r="3" fill="none" stroke="#a9d4f0" stroke-width="1.5"/>
    <circle cx="100" cy="58" r="5" fill="none" stroke="#f7d6b0" stroke-width="1.5"/>
    <path d="M30 60 C26 38 42 30 58 32 C80 34 92 46 90 62 C88 74 78 76 66 74 L60 82 C58 86 50 84 52 78 C42 80 32 72 30 60 Z" fill="#ffffff" stroke="#7a1f3a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M36 40 L40 26 L50 36 Z" fill="#bcdcf5" stroke="#7a1f3a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M60 36 L68 26 L72 40 Z" fill="#bcdcf5" stroke="#7a1f3a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M46 52 Q50 55 54 52" fill="none" stroke="#7a1f3a" stroke-width="2" stroke-linecap="round"/>
    <path d="M60 52 Q64 55 68 52" fill="none" stroke="#7a1f3a" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="42" cy="58" rx="4" ry="2.5" fill="#f7b8c8" opacity="0.7"/>
    <ellipse cx="72" cy="58" rx="4" ry="2.5" fill="#f7b8c8" opacity="0.7"/>
    <path d="M68 72 C74 80 66 92 58 90 C52 88 60 80 68 72 Z" fill="#bcdcf5" opacity="0.8"/>
  </symbol>
</svg>

<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>

<input type="file" id="fileInput" multiple style="display:none"
  accept=".txt,.md,.tsv,.csv,.xlsx,.xls,.xlsm,.ods,.docx,.pdf,.pptx">
 <input type="file" id="sentInput" accept=".txt,.docx,.xlsx,.xls,.csv,.pdf,.pptx" style="display:none">
<input type="file" id="pdfInput" accept=".pdf,.docx,.pptx,.txt,.xlsx" style="display:none">
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
/* ============ DỮ LIỆU ============
   localStorage: bài học (lessons), tiến độ (progress), sổ từ (notes), API key
   IndexedDB: file gốc từng bài, khóa "<id>|<loại file>" */
const KEY = 'meo-xanh-v1';
const PAGE_WORDS = 20;
const PAGE_LIST = 10;
const HANGUL = /[ᄀ-ᇿ㄰-㆏가-힯]/;
const HANGUL_START = /^[ᄀ-ᇿ㄰-㆏가-힯]/;
const SLOTS = [

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.lessons)){
      const progress = s.progress || {};
      Object.values(progress).forEach(p => { if(p.level === undefined) p.level = p.known ? 2 : 0; });
      return {
        lessons: s.lessons.map(l => ({
          modes: {...DEFAULT_MODES}, quizCount: 20, createdAt: 0,
          files: l.hasFile ? {vocab: l.fileName} : {},  // bài tạo từ phiên bản cũ
          ...l
        })),
        progress, notes: s.notes || []
      };
    }
  }catch(e){}
  return {lessons: [], progress: {}, notes: []};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Không lưu được dữ liệu trên trình duyệt này'); }
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D')
  .toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
const lev = (a, b) => {
  let prev = Array.from({length: b.length + 1}, (_, j) => j);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
};

  const pages = Math.max(1, Math.ceil(total / per));
  if(pages <= 1) return '';
  return `<div class="pager">
    <button class="ghost" data-pg="${key}" data-to="${page - 1}" ${page <= 1 ? 'disabled' : ''}>← Trước</button>
    <span class="meta">Trang ${page} / ${pages}</span>
    <button class="ghost" data-pg="${key}" data-to="${page + 1}" ${page >= pages ? 'disabled' : ''}>Sau →</button>

};

/* ============ FILE GỐC (IndexedDB) ============ */
let dbPromise = null;
function db(){
  return dbPromise ||= new Promise((res, rej) => {
    const r = indexedDB.open('meo-xanh-files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function putFile(key, blob){
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction('files', 'readwrite'); t.objectStore('files').put(blob, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function getFile(key){
  const d = await db();
  return new Promise((res, rej) => { const r = d.transaction('files').objectStore('files').get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); });
}
async function delFiles(id){
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('files', 'readwrite'), s = t.objectStore('files');
    SLOTS.forEach(x => s.delete(id + '|' + x.key));
    s.delete(id);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
// File của một slot; bài cũ lưu file từ vựng theo khóa là id
async function lessonFile(l, slot){
  let blob = await getFile(l.id + '|' + slot);
  if(!blob && slot === 'vocab') blob = await getFile(l.id);
  return blob;
}

// Một dòng → {ko, vi}. Nhận: "사과 - táo", "사과: táo", "사과 | táo", tab (Excel), hoặc "사과 táo"
function parseLine(raw, maxLen = 60){
  let line = raw.replace(/ /g, ' ').trim().replace(/^\d+\s*[.)]\s+/, '');
  if(!line) return null;
  let ko, vi;
  if(line.includes('\t')){
    const cells = line.split('\t').map(s => s.trim()).filter(Boolean);
    const i = cells.findIndex(c => HANGUL.test(c));
    if(i < 0) return null;
    ko = cells[i];
    vi = cells.filter((_, j) => j !== i).join(' · ');
  } else {
    const m = line.match(/\s*(\||:|=|,| - | – | — )\s*/);
    if(m){
      ko = line.slice(0, m.index).trim();
      vi = line.slice(m.index + m[0].length).trim();
    } else {
      if(!HANGUL_START.test(line)) return null;
      const sp = line.search(/\s/);
      ko = sp < 0 ? line : line.slice(0, sp);
      vi = sp < 0 ? '' : line.slice(sp).trim();
    }
  }
  if(!HANGUL.test(ko)){
    if(HANGUL.test(vi)) [ko, vi] = [vi, ko];
    else return null;
  }
  if(ko.length > maxLen) return null;
  return {ko, vi};
}
function need(lib, name){ if(typeof lib === 'undefined') throw new Error(`thiếu thư viện đọc ${name}, kiểm tra kết nối mạng`); }

async function fileToLines(file){
  const ext = file.name.split('.').pop().toLowerCase();
  const buf = await file.arrayBuffer();
  if(['txt', 'md', 'tsv'].includes(ext)) return new TextDecoder('utf-8').decode(buf).split(/\r?\n/);
  if(['csv', 'xlsx', 'xls', 'xlsm', 'ods'].includes(ext)){
    need(window.XLSX, 'Excel/CSV');
    const wb = XLSX.read(buf, {type: 'array'});
    const lines = [];
    wb.SheetNames.forEach(n => XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, defval: '', blankrows: false})
      .forEach(r => lines.push(r.map(c => String(c).trim()).join('\t'))));
    return lines;
  }
  if(ext === 'docx'){
    need(window.mammoth, 'Word');
    const {value} = await mammoth.convertToHtml({arrayBuffer: buf});
    const doc = new DOMParser().parseFromString(value, 'text/html');
    const lines = [];
    doc.body.querySelectorAll('p, li, tr').forEach(el => {
      if(el.tagName === 'TR') lines.push([...el.children].map(td => td.textContent.trim()).join('\t'));
      else if(!el.closest('td, th')) lines.push(el.textContent);
    });
    return lines;
  }
  if(ext === 'pdf'){
    need(window.pdfjsLib, 'PDF');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(buf)}).promise;
    const lines = [];
    for(let p = 1; p <= pdf.numPages; p++){
      const tc = await (await pdf.getPage(p)).getTextContent();
      let cur = '';
      tc.items.forEach(it => {
        if(it.hasEOL){ lines.push((cur + it.str).trim()); cur = ''; }
        else cur += it.str + ' ';
      });
      if(cur.trim()) lines.push(cur.trim());
    }
    return lines;
  }
  if(ext === 'pptx'){
    need(window.JSZip, 'PowerPoint');
    const zip = await JSZip.loadAsync(buf);
    const num = f => parseInt(f.match(/slide(\d+)\.xml$/)[1], 10);
    const slides = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a, b) => num(a) - num(b));
    const paraText = el => [...el.getElementsByTagName('a:t')].map(t => t.textContent).join('');
    const inTable = el => { for(let n = el.parentNode; n; n = n.parentNode) if(n.nodeName === 'a:tc') return true; return false; };
    const lines = [];
    for(const f of slides){
      const xml = new DOMParser().parseFromString(await zip.file(f).async('string'), 'application/xml');
      for(const tr of xml.getElementsByTagName('a:tr')) lines.push([...tr.getElementsByTagName('a:tc')].map(paraText).join('\t'));
      for(const p of xml.getElementsByTagName('a:p')) if(!inTable(p)) lines.push(paraText(p));
    }
    return lines;
  }
  throw new Error(`định dạng .${ext} chưa hỗ trợ; file .doc/.ppt cũ hãy lưu lại thành .docx/.pptx`);
}

// Một "bài" ảo cho từng tuần (hoặc tất cả), dùng lại mọi chức năng học của bài từ vựng
function grammarLesson(wk){
  const key = wk + '|' + (state.grammar ? state.grammar.at : 0);
  if(grammarCache[key]) return grammarCache[key];
  const list = grammarItems().filter(x => wk === 'all' || String(x.w) === String(wk));
  const l = {
    id: 'G_' + wk, grammar: true, folder: 'Ngữ pháp', createdAt: 0,
    name: wk === 'all' ? 'Tất cả các tuần' : `Tuần ${wk}`,
    modes: {...DEFAULT_MODES}, quizCount: 20,
    words: list.map(x => ({id: 'g' + x.i, ko: x.ko, vi: x.vi, grammar: true, week: x.w, ex: x.ex, exVi: x.exVi, note: x.note, expand: x.expand, compare: x.compare})),
    sentences: list.filter(x => x.ex && x.exVi).map(x => ({id: 'gs' + x.i, ko: x.ex, vi: x.exVi}))
  };
  Object.keys(grammarCache).forEach(k => delete grammarCache[k]);
  grammarCache[key] = l;
  return l;
}

function parseGrammarRows(rows){
  const cell = v => String(v ?? '').split(/\r?\n/).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean).join(' · ');
  const bad = s => /#VALUE|#N\/A|#REF|#DIV/.test(s);
  let week = 0;
  const out = [];
  rows.slice(1).forEach(r => {
    const stt = parseInt(cell(r[0]), 10);
    if(!isNaN(stt)) week = stt;
    const ko = cell(r[1]);
    const vi = cell(r[2]);
    if(!ko || !vi || bad(vi)) return;
    const clean = i => bad(cell(r[i])) ? '' : cell(r[i]);
    out.push({w: week, ko, vi, ex: clean(3), exVi: clean(4), note: clean(5), expand: clean(6), compare: clean(7)});
  });
  return out;
}
async function refreshGrammar(){
  const url = `https://docs.google.com/spreadsheets/d/${GRAMMAR_SHEET_ID}/gviz/tq?tqx=out:csv`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const text = await r.text();
  const wb = XLSX.read(text, {type: 'string'});
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: ''});
  const items = parseGrammarRows(rows);
  if(!items.length) throw new Error('không đọc được dòng ngữ pháp nào');
  state.grammar = {items, at: Date.now(), src: 'sheet'};
  save();
}
function grammarStatus(){
  if(state.grammar && state.grammar.src === 'sheet') return `Đọc từ Google Sheet, cập nhật lúc ${new Date(state.grammar.at).toLocaleString('vi-VN')}`;

}

let swipeStart = null, swiped = false;
document.addEventListener('pointerdown', e => {
  swipeStart = e.target.closest && e.target.closest('.fcard') ? {x: e.clientX, y: e.clientY} : null;

function newDraft(){
  return ui.draft || (ui.draft = {files: {}, words: null, name: '', folder: '', opts: {...DEFAULT_MODES}, quizCount: 20, busy: false, error: ''});
}
async function draftWords(){
  const d = ui.draft;
  if(d.words) return d.words;
  const seen = new Set(), words = [];
  d.error = '';
  for(const k of ['vocab']){
    const f = d.files[k];
    if(!f) continue;
    try{
      (await fileToLines(f)).forEach(l => {
        const w = parseLine(l);
        if(w && !seen.has(w.ko)){ seen.add(w.ko); words.push(w); }
      });
    }catch(e){ d.error = `${f.name}: ${e.message}`; }
  }
  d.words = words;
  return words;
}
async function setSlotFile(key, file){
  const d = newDraft();
  if(file) d.files[key] = file; else delete d.files[key];
  d.words = null;
  d.busy = true;
  render();
  await draftWords();
  d.busy = false;
  render();
}

}

async function createLesson(){
  const d = ui.draft;
  const words = await draftWords();
  if(!words.length){ toast('Cần file từ vựng có cột Từ · Nghĩa'); return; }
  const id = 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const base = d.files.vocab.name.replace(/\.[^.]+$/, '');
  const files = {};
  for(const s of SLOTS){
    const f = d.files[s.key];
    if(!f) continue;
    files[s.key] = f.name;
    try{ await putFile(id + '|' + s.key, f); } catch(e){}
  }
  state.lessons.push({
    id, name: d.name.trim() || base, folder: d.folder.trim() || 'Chưa xếp thư mục',
    files, modes: {...d.opts}, quizCount: d.quizCount, createdAt: Date.now(),
    words: words.map((w, i) => ({id: id + '_' + i, ko: w.ko, vi: w.vi}))
  });

  toast('Đã tạo bài học');

}

/* ============ THẺ HỌC (dùng cho bài và Ôn tập) ============ */
function flashBody(items, title){
  if(!items.length) return '<div class="card empty">Chưa có từ nào.</div>';
  const key = location.hash + '|' + ui.onlyUnknown;
  if(!ui.fl || ui.fl.key !== key){

function judgeWord(w, v, dir){
  if(dir === 'vi-ko' && w.grammar){
    const toks = w.ko.match(/[\uAC00-\uD7AF]+/g) || [];
    const vv = v.replace(/\s/g, '');
    const hit = toks.length ? toks.filter(t => vv.includes(t)).length / toks.length : 0;
    return {verdict: hit === 1 ? 'ok' : hit >= 0.5 ? 'near' : 'bad', dist: 0};
  }
  if(dir === 'vi-ko'){
    const a = v.replace(/\s/g, ''), s = w.ko.replace(/\s/g, '');
    const dist = lev(a, s);
    return {verdict: dist === 0 ? 'ok' : (dist <= 1 && s.length >= 3 ? 'near' : 'bad'), dist};
  }
  const exp = norm(w.vi).split(' ').filter(Boolean);
  const got = new Set(norm(v).split(' '));
  const hit = exp.length ? exp.filter(t => got.has(t)).length / exp.length : 0;
  return {verdict: hit >= 0.8 ? 'ok' : hit >= 0.5 ? 'near' : 'bad', dist: 0};
}
function feedbackHTML(r, w, dir){
  const answer = dir === 'vi-ko' ? esc(w.ko) : esc(w.vi || '(chưa có nghĩa)');
  if(r.verdict === 'ok') return '<div class="fb ok"><b>✔ Đúng!</b></div>';
  if(r.verdict === 'near') return `<div class="fb near"><b>Gần đúng</b>${dir === 'vi-ko' && r.dist ? ` — sai ${r.dist} chữ` : ''}. Đáp án: <b>${answer}</b></div>`;
  return `<div class="fb bad"><b>Chưa đúng.</b> Đáp án: <b>${answer}</b></div>`;
}

// Khung viết tay: bút, tẩy theo từng nét, quay lại / quay lên
function bindWriteUI(){
  bindInk();
  const wi = $('#wIn');
  if(wi) wi.oninput = wordAutoCheck;
  const si = $('#sIn');
  if(si) si.oninput = sentAutoCheck;
}
function bindInk(){
  const c = $('#ink');
  if(!c) return;
  const dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr;
  c.height = c.clientHeight * dpr;
  c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  drawInk(c);
}
function drawInk(c){
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.clientWidth, c.clientHeight);
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#2f63a8';
  ui.strokes.forEach(st => {
    if(!st.length) return;
    ctx.beginPath();
    ctx.moveTo(st[0].x, st[0].y);
    st.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    if(st.length === 1) ctx.lineTo(st[0].x + 0.1, st[0].y);
    ctx.stroke();
  });
}
function resetInk(){
  ui.strokes = [];
  ui.past = [];
  ui.future = [];
}
// Lưu trạng thái nét trước mỗi thao tác để quay lại / quay lên
function snapInk(){
  ui.past.push(JSON.stringify(ui.strokes));
  if(ui.past.length > 100) ui.past.shift();
  ui.future = [];
  const undo = $('[data-act="inkUndo"]'), redo = $('[data-act="inkRedo"]');
  if(undo) undo.disabled = false;
  if(redo) redo.disabled = true;
}
function undoInk(){
  if(!ui.past.length) return;
  ui.future.push(JSON.stringify(ui.strokes));
  ui.strokes = JSON.parse(ui.past.pop());
  render();
}
function redoInk(){
  if(!ui.future.length) return;
  ui.past.push(JSON.stringify(ui.strokes));
  ui.strokes = JSON.parse(ui.future.pop());
  render();
}
let inkDrawing = false;
const inkPos = (c, e) => { const r = c.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
// Tẩy: xóa cả nét nào chạm vào vị trí tẩy
function eraseAt(p){
  const before = ui.strokes.length;
  ui.strokes = ui.strokes.filter(st => !st.some(q => Math.hypot(q.x - p.x, q.y - p.y) < 14));
  if(ui.strokes.length !== before) drawInk($('#ink'));
}
document.addEventListener('pointerdown', e => {
  const c = e.target.closest && e.target.closest('#ink');
  if(!c) return;
  e.preventDefault();
  inkDrawing = true;
  snapInk();
  const p = inkPos(c, e);
  if(ui.tool === 'erase') eraseAt(p);
  else ui.strokes.push([p]);
  drawInk(c);
});
document.addEventListener('pointermove', e => {
  if(!inkDrawing) return;
  const c = $('#ink');
  if(!c) return;
  const p = inkPos(c, e);
  if(ui.tool === 'erase') eraseAt(p);
  else ui.strokes[ui.strokes.length - 1].push(p);
  drawInk(c);
});
document.addEventListener('pointerup', () => { inkDrawing = false; });
function nextInk(){
  clearTimeout(ui.wTimer);
  ui.wId = null; ui.sId = null; ui.eId = null;
  ui.wRes = null; ui.sRes = null; ui.eRes = null;
  resetInk();
  ui.reveal = false;
  render();
}
function stemOf(ko){ return ko.length > 1 && ko.endsWith('다') ? ko.slice(0, -1) : ko; }
function checkExt(){
  const l = findLesson(route().id);
  const w = l && l.words.find(x => x.id === ui.eId);
  if(!w) return;
  const texts = [$('#e1').value.trim(), $('#e2').value.trim()];
  if(!texts[0] || !texts[1]){ toast('Viết đủ 2 câu rồi chấm'); return; }
  const s = stemOf(w.ko);
  ui.eRes = texts.map(t => ({ok: t.includes(s)}));
  if(ui.eRes.every(x => x.ok)) setProg(w.id, {ext: true});
  render();
}

/* ============ KIỂM TRA ============ */
const testCfg = l => ({mc: true, tf: false, essay: false, showNow: false, ...(l.testCfg || {})});
function testSetup(l){
  const cfg = testCfg(l);
  const row = (label, control) => `<div class="srow"><span>${label}</span>${control}</div>`;
  const sw = key => `<input type="checkbox" class="sw" data-cfg="${key}" ${cfg[key] ? 'checked' : ''} aria-label="${key}">`;
  return `<div class="card testset">
    ${row('Số câu hỏi', `<select data-quizcount style="width:auto">${[10, 20, 0].map(v => `<option value="${v}" ${(l.quizCount ?? 20) === v ? 'selected' : ''}>${v || 'Tất cả'}</option>`).join('')}</select>`)}
    ${row('Hiển thị đáp án ngay', sw('showNow'))}
    ${row('Đúng / Sai', sw('tf'))}
    ${row('Nhiều lựa chọn (ABCD)', sw('mc'))}
    ${row('Tự luận', sw('essay'))}
    ${row('Chỉ từ chưa nhớ', `<input type="checkbox" class="sw" data-only ${ui.onlyUnknown ? 'checked' : ''} aria-label="Chỉ từ chưa nhớ">`)}
    <button class="wide" data-act="quizStart">Bắt đầu làm kiểm tra</button>
  </div>`;
}
function quizView(l){
  const q = ui.quiz && ui.quiz.lesson === l.id ? ui.quiz : null;
  if(!q) return testSetup(l);
  const cfg = testCfg(l);
  if(q.i >= q.items.length) return `<div class="card empty">
      <h2>Xong rồi!</h2>
      <p>Đúng ${q.score} / ${q.items.length} câu (${Math.round(100 * q.score / q.items.length)}%)</p>
      <div class="row" style="justify-content:center">
        <button data-act="quizStart">Làm lại</button>
        <button class="ghost" data-act="quizSetup">Đổi cài đặt</button>
      </div>
    </div>`;
  const it = q.items[q.i];
  const answered = q.answered !== null;
  const reveal = answered && cfg.showNow;
  const head = `<div class="qhead"><span class="meta">Câu ${q.i + 1} / ${q.items.length}</span><span class="meta">Đúng: ${q.score}</span></div>`;
  const next = answered ? `<div class="row" style="justify-content:flex-end;margin-top:12px">
      <button data-act="quizNext">${q.i + 1 < q.items.length ? 'Câu tiếp →' : 'Xem kết quả'}</button></div>` : '';
  const saved = answered && !cfg.showNow ? '<p class="hint">Đã ghi nhận. Đáp án sẽ hiện ở phần kết quả.</p>' : '';
  let body;
  if(it.type === 'mc'){
    const correct = it.opts.findIndex(o => o.id === it.w.id);
    body = `<div class="ko" style="font-size:clamp(30px,8vw,44px);text-align:center;margin:16px 0">${esc(it.w.ko)}</div>
      <p class="hint" style="text-align:center;margin:-6px 0 14px">Chọn nghĩa đúng (phím 1–4)</p>
      ${it.opts.map((o, i) => {
        let cls = '';
        if(reveal){ if(i === correct) cls = 'right'; else if(i === q.answered) cls = 'wrong'; }
        else if(answered && i === q.answered) cls = 'picked';
        return `<button class="opt ${cls}" data-act="quizPick" data-i="${i}" ${answered ? 'disabled' : ''}>${'ABCD'[i]}. ${esc(o.vi)}</button>`;
      }).join('')}`;
  } else if(it.type === 'tf'){
    const ok = q.answered === it.truth;
    body = `<div class="ko" style="font-size:clamp(30px,8vw,44px);text-align:center;margin:16px 0">${esc(it.w.ko)}</div>
      <div class="qword" style="text-align:center;font-size:clamp(20px,5vw,26px)">${esc(it.shownVi)}</div>
      <p class="hint" style="text-align:center">Nghĩa trên có đúng không?</p>
      <div class="lvbtns" style="grid-template-columns:1fr 1fr;margin-top:18px">
        <button class="lv2" data-act="tfAns" data-v="1" ${answered ? 'disabled' : ''}>Đúng</button>
        <button class="lv0" data-act="tfAns" data-v="0" ${answered ? 'disabled' : ''}>Sai</button>
      </div>
      ${reveal ? `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? '✔ Đúng!' : `Chưa đúng. Nghĩa đúng: ${esc(it.w.vi)}`}</div>` : ''}`;
  } else {
    const ok = q.answered === true;
    body = `<div class="meta">Viết từ tiếng Hàn cho nghĩa:</div>
      <div class="qword">${esc(it.w.vi)}</div>
      <label class="f">Câu trả lời<input id="essayIn" autocomplete="off" placeholder="Gõ từ tiếng Hàn…" ${answered ? 'disabled' : ''} value="${answered ? esc(q.typed || '') : ''}"></label>
      ${reveal ? `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? '✔ Đúng!' : `Đáp án: <b>${esc(it.w.ko)}</b>`}</div>` : ''}
      ${answered ? '' : '<div class="row" style="justify-content:flex-end;margin-top:12px"><button data-act="essayCheck">Kiểm tra</button></div>'}`;
  }
  return `<div class="card">${head}${body}${saved}${next}</div>`;
}
function makeOptions(w, own){
  const others = shuffle(own.filter(x => x.id !== w.id))
    .concat(shuffle(state.lessons.flatMap(l => l.words).filter(x => x.vi && x.id !== w.id && !own.includes(x))));
  const opts = [w];
  const seen = new Set([w.vi]);
  for(const x of others){
    if(opts.length >= 4) break;
    if(x.vi && !seen.has(x.vi)){ seen.add(x.vi); opts.push(x); }
  }
  return shuffle(opts);
}
function startQuiz(){
  const l = findLesson(route().id);
  if(!l) return;
  const cfg = testCfg(l);
  const types = ['mc', 'tf', 'essay'].filter(t => cfg[t]);
  if(!types.length){ toast('Chọn ít nhất một loại câu hỏi'); return; }
  const pool = l.words.filter(w => w.vi && (!ui.onlyUnknown || lvl(w.id) < 2));
  const all = state.lessons.flatMap(x => x.words).filter(w => w.vi);
  if(!pool.length){ toast('Không còn từ nào để làm'); return; }
  if(types.includes('mc') && all.length < 4 && types.length === 1){ toast('Cần ít nhất 4 từ có nghĩa để làm câu ABCD'); return; }
  const n = l.quizCount || 0;
  const picks = shuffle(pool).slice(0, n || pool.length);
  const items = picks.map((w, i) => {
    const type = types[i % types.length];
    if(type === 'mc') return {type, w, opts: makeOptions(w, pool)};
    if(type === 'tf'){
      const others = all.filter(x => x.vi !== w.vi);
      const truth = !others.length || Math.random() < 0.5;
      const shownVi = truth ? w.vi : others[Math.floor(Math.random() * others.length)].vi;
      return {type, w, truth, shownVi};
    }
    return {type, w};
  });
  ui.quiz = {lesson: l.id, items: shuffle(items), i: 0, score: 0, answered: null};
  render();
}
function recordAnswer(ok){
  const q = ui.quiz;
  const w = q.items[q.i].w;
  if(ok) q.score++;
  const p = prog(w.id);
  setProg(w.id, {qr: (p.qr || 0) + (ok ? 1 : 0), qw: (p.qw || 0) + (ok ? 0 : 1)});
}
function answerQuiz(i){
  const q = ui.quiz;
  const it = q && q.items[q.i];
  if(!it || it.type !== 'mc' || q.answered !== null || !it.opts[i]) return;
  q.answered = i;
  recordAnswer(it.opts[i].id === it.w.id);
  render();
}
function answerTF(v){
  const q = ui.quiz;
  const it = q && q.items[q.i];
  if(!it || it.type !== 'tf' || q.answered !== null) return;
  q.answered = v;
  recordAnswer(v === it.truth);
  render();
}
function essayCheck(){
  const q = ui.quiz;
  const it = q && q.items[q.i];
  const box = $('#essayIn');
  if(!it || it.type !== 'essay' || q.answered !== null || !box) return;
  const v = box.value.trim();
  if(!v){ toast('Gõ đáp án trước'); return; }
  q.typed = v;
  q.answered = lev(v.replace(/\s/g, ''), it.w.ko.replace(/\s/g, '')) === 0;
  recordAnswer(q.answered);
  render();
}
function nextQuiz(){
  const q = ui.quiz;
  if(!q || q.answered === null) return;
  q.i++;
  q.answered = null;
  render();
}

/* ============ GHÉP THẺ ============ */
const MATCH_SIZE = 6;
const elapsed = m => (((m.end || Date.now()) - m.start) / 1000).toFixed(1);
function matchStart(l){
  const pool = l.words.filter(w => w.vi && (!ui.onlyUnknown || lvl(w.id) < 2));
  if(pool.length < 2){ toast('Cần ít nhất 2 từ có nghĩa để ghép thẻ'); return; }
  const picked = shuffle(pool).slice(0, MATCH_SIZE);
  const cards = shuffle(picked.flatMap(w => [{u: w.id + 'k', wid: w.id, text: w.ko}, {u: w.id + 'v', wid: w.id, text: w.vi}]));
  ui.match = {lesson: l.id, cards, open: [], done: new Set(), start: Date.now(), end: 0, wrong: 0, busy: false};
  render();
}
function matchView(l){
  const m = ui.match && ui.match.lesson === l.id ? ui.match : null;
  if(!m) return `<div class="card empty">
    <p>Ghép từ tiếng Hàn với nghĩa tiếng Việt. Chạm hai thẻ, nếu đúng cặp thì ẩn đi.</p>
    <button data-act="matchStart">Bắt đầu ghép</button>
  </div>`;
  const total = m.cards.length / 2;
  if(m.done.size === total) return `<div class="card empty">
    <h2>Hoàn thành!</h2>
    <p>Trong ${elapsed(m)} giây · sai ${m.wrong} lần</p>
    <button data-act="matchStart">Vòng mới</button>
  </div>`;
  const grid = m.cards.map(c => {
    const done = m.done.has(c.wid), open = m.open.includes(c.u);
    const cls = done ? 'done' : open ? 'open' : '';
    return `<button class="mcard ${cls}" data-act="mcard" data-u="${c.u}" ${done || open ? 'disabled' : ''}>${done || open ? esc(c.text) : '?'}</button>`;
  }).join('');
  return `<div class="card">
    <div class="row between" style="margin-bottom:12px">
      <span class="meta">Đã ghép ${m.done.size} / ${total} cặp</span>
      <span class="meta"><span id="mtime">${elapsed(m)}</span> giây</span>
    </div>
    <div class="mgrid">${grid}</div>
    <p class="hint" style="text-align:center">Chạm hai thẻ để tìm cặp đúng: tiếng Hàn ↔ nghĩa tiếng Việt.</p>
  </div>`;
}
function matchTimer(){
  clearInterval(ui.matchTick);
  ui.matchTick = setInterval(() => {
    const el = $('#mtime');
    if(!el || !ui.match || ui.match.end) { clearInterval(ui.matchTick); return; }
    el.textContent = elapsed(ui.match);
  }, 200);
}
function matchPick(u){
  const m = ui.match;
  if(!m || m.busy) return;
  const c = m.cards.find(x => x.u === u);
  if(!c || m.open.includes(u) || m.done.has(c.wid)) return;
  m.open.push(u);
  if(m.open.length === 2){
    const [a, b] = m.open.map(x => m.cards.find(y => y.u === x));
    if(a.wid === b.wid){
      m.done.add(a.wid);
      m.open = [];
      if(m.done.size === m.cards.length / 2) m.end = Date.now();
    } else {
      m.wrong++;
      m.busy = true;
      setTimeout(() => { m.open = []; m.busy = false; render(); }, 800);
    }
  }
  render();
}

/* ============ THỐNG KÊ ============ */
function renderStats(main){
  const words = state.lessons.flatMap(l => l.words);
  const known = words.filter(w => lvl(w.id) === 2).length;
  const qr = words.reduce((n, w) => n + (prog(w.id).qr || 0), 0);
  const qw = words.reduce((n, w) => n + (prog(w.id).qw || 0), 0);
  const acc = qr + qw ? Math.round(100 * qr / (qr + qw)) + '%' : 'Chưa làm';
  const stat = (l, v, s = '') => `<div class="stat"><div class="l">${l}</div><div class="v">${v}${s ? ` <small>${s}</small>` : ''}</div></div>`;
  main.innerHTML = `
    <div class="crumb">Thống kê</div>
    <h1>Thống kê</h1>
    <p class="sub">Tiến độ học của bạn trên tất cả các bài.</p>
    <div class="grid4" style="margin:18px 0">
      ${stat('Số bài', state.lessons.length)}
      ${stat('Tổng số từ', words.length)}
      ${stat('Đã nhớ', words.length ? Math.round(100 * known / words.length) + '%' : '0%', `${known} từ`)}
      ${stat('Trắc nghiệm đúng', acc, qr + qw ? `${qr}/${qr + qw}` : '')}
    </div>
    <div class="card">
      <h2>Theo từng bài</h2>
      ${state.lessons.length ? `<table class="words"><thead><tr><th>Bài</th><th>Từ</th><th>Đã nhớ</th><th style="width:30%">Tiến độ</th></tr></thead><tbody>
        ${state.lessons.map(l => `<tr>
          <td><a href="#/lesson/${l.id}/overview">${esc(l.name)}</a><div class="meta">${esc(l.folder)}</div></td>
          <td>${l.words.length}</td>
          <td>${lessonPct(l)}%</td>
          <td><div class="track"><div class="fill ok" style="width:${lessonPct(l)}%"></div></div></td>
        </tr>`).join('')}</tbody></table>` : '<p class="empty">Chưa có bài nào.</p>'}
    </div>`;
}

/* ============ TRANG CHUNG & HỘP THOẠI ============ */
function emptyPage(text){
  return `<div class="card empty"><p>${text}</p><a class="btn" href="#/home">Tạo bài học</a></div>`;
}
function openDialog(title, body, onOk){
  const d = $('#dlg');
  d.innerHTML = `<form class="dlgbox"><h2>${esc(title)}</h2>${body}
    <div class="row actions" style="justify-content:flex-end">
      <button type="button" class="ghost" data-cancel>Hủy</button>
      <button type="submit">Lưu</button>
    </div></form>`;
  const form = d.querySelector('form');
  d.querySelector('[data-cancel]').onclick = () => d.close();
  form.onsubmit = e => {
    e.preventDefault();
    if(onOk(Object.fromEntries(new FormData(form))) !== false) d.close();
  };
  d.showModal();
}
function openWordDialog(lessonId, wordId){
  const l = findLesson(lessonId);
  const w = wordId ? l.words.find(x => x.id === wordId) : null;
  openDialog(w ? 'Sửa từ' : 'Thêm từ', `
    <label class="f">Tiếng Hàn<input name="ko" value="${esc(w ? w.ko : '')}" autocomplete="off"></label>
    <label class="f">Nghĩa tiếng Việt<input name="vi" value="${esc(w ? w.vi : '')}"></label>`, f => {
      const ko = f.ko.trim(), vi = f.vi.trim();
      if(!HANGUL.test(ko)){ toast('Từ tiếng Hàn chưa đúng, hãy nhập lại'); return false; }
      if(w){ w.ko = ko; w.vi = vi; }
      else l.words.push({id: l.id + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ko, vi});
      save(); render();
    });
}
function deleteWord(lessonId, wordId){
  const l = findLesson(lessonId);
  if(!confirm('Xóa từ này khỏi bài?')) return;
  l.words = l.words.filter(w => w.id !== wordId);
  delete state.progress[wordId];
  save();
  render();
}
async function deleteLesson(id){
  const l = findLesson(id);
  if(!l || !confirm(`Xóa bài "${l.name}", toàn bộ từ, tiến độ và file của bài này?`)) return;
  state.lessons = state.lessons.filter(x => x.id !== id);
  l.words.forEach(w => delete state.progress[w.id]);
  state.notes = state.notes.filter(n => n.lessonId !== id);
  save();
  try{ await delFiles(id); } catch(e){}
  toast('Đã xóa bài');
  go('#/home');
}
function editLesson(id){
  const l = findLesson(id);
  if(!l) return;
  const m = l.modes || DEFAULT_MODES;
  openDialog('Sửa bài', `
    <label class="f">Tên bài<input name="name" value="${esc(l.name)}"></label>
    <label class="f">Thư mục<input name="folder" list="folderOpts" value="${esc(l.folder)}"></label>
    <datalist id="folderOpts">${[...new Set(state.lessons.map(x => x.folder))].map(f => `<option value="${esc(f)}">`).join('')}</datalist>
    <label class="f">Số câu trắc nghiệm<select name="quizCount">${[10, 20, 0].map(v => `<option value="${v}" ${(l.quizCount ?? 20) === v ? 'selected' : ''}>${v ? v + ' câu' : 'Tất cả'}</option>`).join('')}</select></label>`, f => {
      l.name = f.name.trim() || l.name;
      l.folder = f.folder.trim() || 'Chưa xếp thư mục';
      l.quizCount = +f.quizCount;
      l.modes = m;
      save(); render();
    });
}
function attachFile(id){
  ui.attachId = id;
  $('#pdfInput').click();
}

/* ============ SỰ KIỆN ============ */
function act(name, d){
  const r = route();
  switch(name){
    case 'clearSlot': setSlotFile(d.v, null); break;
    case 'upload': $('#fileInput').click(); break;
    case 'gRefresh': refreshGrammar().then(() => { toast('Đã cập nhật ngữ pháp'); render(); }).catch(e => toast('Không đọc được sheet (' + e.message + '). Hãy bật "Bất kỳ ai có đường liên kết đều xem được" trong sheet.')); break;
    case 'folderToggle': { const set = ui.openFolders; if(set.has(d.v)) set.delete(d.v); else set.add(d.v); renderSide(route()); break; }
    case 'preview': openPreview(); break;
    case 'createLesson': createLesson(); break;
    case 'lv': flashLevel(+d.v); break;
    case 'flip': ui.fl.flipped = !ui.fl.flipped; render(); break;
    case 'prev': flashStep(-1); break;
    case 'next': flashStep(1); break;
    case 'shuffle': ui.fl.ids = shuffle(ui.fl.ids); ui.fl.i = 0; ui.fl.flipped = false; render(); break;
    case 'dir': ui.dir = d.v; ui.fl.flipped = false; render(); break;
    case 'onlyOff': ui.onlyUnknown = false; render(); break;
    case 'saveNote': saveNote(d.id); break;
    case 'wNext': ui.wId = null; ui.wRes = null; render(); break;
    case 'attachSent': attachSent(d.id); break;
    case 'sReveal': ui.reveal = true; render(); break;
    case 'sRecord': sessRecord(ui.sess && ui.sess.cur, d.v === '1'); break;
    case 'sRedo': redoSent('one', d.id); break;
    case 'sRedoWrong': redoSent('wrong'); break;
    case 'sRedoRight': redoSent('right'); break;
    case 'sRedoAll': redoSent('all'); break;
    case 'eCheck': checkExt(); break;
    case 'eNext': ui.eId = null; ui.eRes = null; render(); break;
    case 'quizStart': startQuiz(); break;
    case 'quizSetup': ui.quiz = null; render(); break;
    case 'tfAns': answerTF(d.v === '1'); break;
    case 'essayCheck': essayCheck(); break;
    case 'inkMode': ui.ink = d.v === '1'; resetInk(); ui.reveal = false; render(); break;
    case 'inkTool': ui.tool = d.v; render(); break;
    case 'inkUndo': undoInk(); break;
    case 'inkRedo': redoInk(); break;
    case 'wFilter': ui.wFilter = d.v; ui.wId = null; ui.sId = null; ui.eId = null; render(); break;
    case 'wDir': ui.wDir = d.v; ui.wId = null; resetInk(); render(); break;
    case 'wNext': nextInk(); break;
    case 'inkReveal': ui.reveal = true; render(); break;
    case 'inkOk': { const l = findLesson(route().id); const w = l && l.words.find(x => x.id === ui.wId); if(w) setProg(w.id, {wOk: true}); nextInk(); break; }
    case 'inkNext': nextInk(); break;
    case 'eDone': { const l = findLesson(route().id); const w = l && l.words.find(x => x.id === ui.eId); if(w) setProg(w.id, {ext: true}); nextInk(); break; }
    case 'matchStart': { const l = findLesson(route().id); if(l) matchStart(l); break; }
    case 'mcard': matchPick(d.u); break;
    case 'quizPick': answerQuiz(+d.i); break;
    case 'quizNext': nextQuiz(); break;
    case 'addWord': openWordDialog(d.id, null); break;
    case 'editWord': openWordDialog(d.lesson, d.id); break;
    case 'delWord': deleteWord(d.lesson, d.id); break;
    case 'editLesson': editLesson(d.id); break;
    case 'delLesson': deleteLesson(d.id); break;
    case 'attach': attachFile(d.id); break;
    case 'lesson': go(`#/lesson/${d.id}/${d.mode}`); break;
    case 'addNote': addNote(); break;
    case 'notesFilter': ui.notesFilter = d.v; render(); break;
    case 'delNote':
      if(confirm('Xóa mục này khỏi sổ từ?')){ state.notes = state.notes.filter(n => n.id !== d.id); save(); render(); }
      break;
  }
}

document.addEventListener('click', e => {
  if(swiped){ swiped = false; return; }
  const pg = e.target.closest('[data-pg]');
  if(pg){ ui[pg.dataset.pg] = +pg.dataset.to; render(); return; }
  const sp = e.target.closest('[data-slotpick]');
  if(sp){
    e.preventDefault();
    const l = findLesson(route().id);
    if(l) renderSourceWith(l, sp.dataset.slotpick);
    return;
  }
  const el = e.target.closest('[data-act]');
  if(el) act(el.dataset.act, el.dataset);
});

async function renderSourceWith(l, slot){
  const body = $('#srcBody');
  if(!body) return;
  if(ui.fileUrl){ URL.revokeObjectURL(ui.fileUrl); ui.fileUrl = null; }
  const blob = await lessonFile(l, slot);
  const slots = Object.keys(l.files || {});
  const tabs = slots.map(s => `<a class="chip ${s === slot ? 'on' : ''}" href="#/lesson/${l.id}/source" data-slotpick="${s}">${SLOTS.find(x => x.key === s).title}</a>`).join('');
  if(!blob){ body.innerHTML = '<p class="empty">Không mở được file đã lưu.</p>'; return; }
  ui.fileUrl = URL.createObjectURL(blob);
  const isPdf = blob.type === 'application/pdf' || /\.pdf$/i.test(l.files[slot] || '');
  body.innerHTML = `<div class="chips" style="margin-bottom:12px">${tabs}</div>` + (isPdf
    ? `<iframe class="pdf" src="${ui.fileUrl}" title="Tài liệu gốc"></iframe>`
    : `<p class="empty">File này không xem trực tiếp được trong trang.</p>
       <div class="row" style="justify-content:center"><a class="btn ghost" href="${ui.fileUrl}" download="${esc(l.files[slot])}">Tải file gốc</a></div>`);
}

document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset && t.dataset.slot){
    const f = t.files[0];
    t.value = '';
    if(f) setSlotFile(t.dataset.slot, f);
    return;
  }
  if(t.dataset && t.dataset.opt){
    const d = newDraft();
    d.opts[t.dataset.opt] = t.checked;
    render();
    return;
  }
  if(t.dataset && t.dataset.cfg){
    const l = findLesson(route().id);
    if(l){ l.testCfg = {...testCfg(l), [t.dataset.cfg]: t.checked}; ui.quiz = null; save(); render(); }
    return;
  }
  if(t.hasAttribute && t.hasAttribute('data-quizcount')){
    const v = +t.value;
    const r = route();
    if(r.name === 'lesson'){
      const l = findLesson(r.id);
      if(l){ l.quizCount = v; save(); ui.quiz = null; render(); }
    } else { newDraft().quizCount = v; render(); }
    return;
  }
  if(t.hasAttribute && t.hasAttribute('data-only')){
    ui.onlyUnknown = t.checked;
    ui.fl = null;
    ui.quiz = null;
    render();
    return;
  }
});

document.addEventListener('keydown', e => {
  const field = e.target.closest('input, textarea, select');
  if(field){
    if(e.key === 'Enter' && e.target.id === 'wIn') wordAutoCheck();
    return;
  }
  if(e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  const r = route();
  if(r.name === 'lesson' && r.tab === 'flash' || r.name === 'review'){
    if(!ui.fl) return;
    if(e.key === 'ArrowRight') flashStep(1);
    else if(e.key === 'ArrowLeft') flashStep(-1);
    else if(e.key === ' '){ e.preventDefault(); act('flip'); }
    else if(e.key === '1') flashLevel(0);
    else if(e.key === '2') flashLevel(1);
    else if(e.key === '3') flashLevel(2);
  }
  if(r.name === 'lesson' && r.tab === 'quiz' && ui.quiz){
    const it = ui.quiz.items[ui.quiz.i];
    if(it && it.type === 'mc' && /^[1-4]$/.test(e.key)) answerQuiz(+e.key - 1);
    else if(it && it.type === 'tf' && (e.key === '1' || e.key === '2')) answerTF(e.key === '1');
    else if(e.key === 'Enter') nextQuiz();
  }
});

// Kéo thả file vào từng ô tải lên
document.addEventListener('dragover', e => {
  const s = e.target.closest && e.target.closest('[data-drop]');
  if(s){ e.preventDefault(); s.classList.add('over'); }
});
document.addEventListener('dragleave', e => {
  const s = e.target.closest && e.target.closest('[data-drop]');
  if(s) s.classList.remove('over');
});
document.addEventListener('drop', e => {
  const s = e.target.closest && e.target.closest('[data-drop]');
  if(!s) return;
  e.preventDefault();
  s.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if(f) setSlotFile(s.dataset.drop, f);
});

$('#fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  setSlotFile('vocab', f);
  go('#/home');
});
$('#pdfInput').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  const l = findLesson(ui.attachId);
  if(!f || !l) return;
  try{
    await putFile(l.id + '|' + (f.name.toLowerCase().endsWith('.pdf') ? 'lecture' : 'grammar'), f);
    l.files = {...(l.files || {}), [f.name.toLowerCase().endsWith('.pdf') ? 'lecture' : 'grammar']: f.name};
    save();
    toast('Đã đính kèm file');
  }catch(err){
    toast('Không lưu được file: ' + err.message);
  }
  render();
});

render();
</script>
</body>
</html>
